# SCOPE of Killercoda support (rules: docs/RUN-A-LAB-ANYWHERE.md, generated table: docs/KILLERCODA-STATUS.md).
# scope:  the certifications Killercoda supports (kubeadm and Ubuntu VMs). A lab of these that has Killercoda evidence in
#         evidence.yaml is `tested` and its parity check is a gate; every other lab is `loaded-untested`: it stays in the
#         repo, runs locally with study-lab, is never a CI failure and is never pushed to the Killercoda mirror.
# failed: lab -> why a lab with a reference fix did not pass the batch run (one line each; no issue per lab).
scope: [cka, ckad]
failed: {}
# What study-lab export --target killercoda publishes by default (the pilot, issue #43).
# Only labs whose environment Killercoda has: linux -> ubuntu, kind -> kubernetes-kubeadm-1node.
pilot:
  - cka/1.1
  - lpic-2/200.1
# Setup a lab needs from the Killercoda host (capabilities defined in killercoda_envs.yaml), by lab.
needs:
  cka/1.1: [default-storageclass]
