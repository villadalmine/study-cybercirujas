# What Killercoda runs, pinned in one place. The parity test (study-lab test --target killercoda) builds this
# environment and the publish gate compares its versions with the evidence of each scenario.
#
# status: reported  = told to us by the owner, not in Killercoda's docs (killercoda.com/creators, /faq, /pricing say nothing
#                     about images, versions or resources: checked 2026-10-16)
#         unmeasured = unknown: run the probe scenario (probe/, published in the mirror) on Killercoda and paste its output here
#         measured  = read from a real Killercoda session (who and when in `measured_by`)
# Evidence records parity: measured only when every fact of the image (and of today's Kubernetes row) is `measured`.
# status of 2026-10-19: both images measured by the probe run by @villadalmine (issue #99); the Cilium version is assumed (`version_status`).
schema: 1
documented_limits:   # killercoda.com/faq, /pricing (2026-10-16); nothing numeric for creators is documented
  session: "1 hour on the free plan, 4 hours with a paid membership (FAQ); no daily or monthly usage limits (FAQ)"
  creators: "FREE can create public scenarios and share them (pricing); no limit on scenarios, repo size, assets or background-script time is documented: ask support"
  terms: "commercial use, branding and links are not stated on the pages we can read (terms/AGB are a separate document): ask support before any banner"
images:
  # source: measured (probe run by @villadalmine, 2026-10-19). The first version of this file ASSUMED kubeadm 1.36.5 with flannel;
  # the probe showed 1.36.1 with Cilium. Lesson: probe first, never assume (docs/RUN-A-LAB-ANYWHERE.md "Probe first").
  ubuntu:
    source: measured (probe run by @villadalmine, 2026-10-19)
    os: {name: Ubuntu, version: '24.04', point_release: '24.04.5 LTS', kernel: 6.8.0-146-generic, arch: amd64, status: measured}
    resources: {cpu: 1, ram_total_mib: 1903, ram_available_mib: 1499, disk: 19G, disk_free: 13G, status: measured}
    tools: {docker: 29.1.3, podman: 4.9.3, python3: 3.12.3, systemd: running, status: measured}
  kubernetes-kubeadm-1node:
    source: measured (probe run by @villadalmine, 2026-10-19)
    os: {name: Ubuntu, version: '24.04', point_release: '24.04.5 LTS', kernel: 6.8.0-146-generic, arch: amd64, status: measured}
    kubernetes:        # the version Killercoda runs on a date; the gate picks the row that contains today
      # 1.36.1 measured (kubectl client v1.36.1, server v1.36.1, Kustomize v5.8.1). The 1.37 switch date is as reported, not measured.
      - {from: '2000-01-01', until: '2026-10-25', minor: '1.36', patch: '1.36.1', status: measured}
      - {from: '2026-10-25', minor: '1.37', patch: '1.37.1', status: reported}
    runtime: {name: containerd, version: 2.2.1, crictl: v1.37.0, status: measured}
    # Cilium measured (pods cilium, cilium-envoy, cilium-operator; conflist 05-cilium.conflist; cilium-cni in /opt/cni/bin).
    # The probe did not print the Cilium VERSION: v1.20.3 is the newest stable that supports Kubernetes 1.36 (docs.cilium.io), assumed.
    cni: {name: cilium, version: v1.20.3, version_status: assumed, cli: v0.20.1, conflist: 05-cilium.conflist, status: measured}
    node_name: {value: controlplane, ip: 172.30.1.2, status: measured}
    default_storageclass: {name: local-path, provisioner: rancher.io/local-path, reclaim: Delete, binding: WaitForFirstConsumer, status: measured}
    resources: {cpu: 1, ram_total_mib: 2246, ram_available_mib: 947, disk: 19G, disk_free: 7.4G, status: measured}
    tools: {docker: 29.1.3, podman: 4.9.3, python3: 3.12.3, systemd: running, status: measured}
capabilities:          # setup a lab asks for (tracks.yaml: needs); added to background.sh only when missing
  default-storageclass:
    script: |
      if ! kubectl get storageclass 2>/dev/null | grep -q .; then
        kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
        kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      fi
