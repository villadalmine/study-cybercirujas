apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  {{- $secret := required "env.TEACH_SECRET is required: set a random value of at least 32 characters in values-local (e.g. openssl rand -hex 32; with --set use --set-string)" .Values.env.TEACH_SECRET | toString }}
  {{- if or (lt (len $secret) 32) (hasPrefix "PONER-" $secret) (eq $secret "change-me") }}
  {{- fail "env.TEACH_SECRET is a placeholder or shorter than 32 characters: set a random value (e.g. openssl rand -hex 32)" }}
  {{- end }}
  TEACH_SECRET: {{ $secret | quote }}
  {{- if .Values.llm.apiKey }}
  LITELLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
