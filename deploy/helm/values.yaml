# teach-plat chart defaults (Gateway API + cert-manager). Defaults are generic: put your real domain,
# registry and secrets in values-local.yaml (gitignored); see values-study.example.yaml.

image:
  # Building in-cluster (Kaniko) into your own registry? Override in values-local.yaml:
  #   repository: registry.registry:5000/teach-plat
  repository: ghcr.io/villadalmine/study-cybercirujas
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []
nodeSelector: {}

app:
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Exponer vía Gateway API (Cilium). El HTTPRoute se engancha al Gateway existente
# `name`/`namespace` (the defaults below are an example: set yours in values-local.yaml).
# host = dominio principal; extraHosts = otros dominios en la MISMA route
# (e.g. a public host plus a local one).
# OJO: cada host público HTTPS necesita su listener + cert en el Gateway.
gateway:
  enabled: false
  host: study.cluster.home
  extraHosts: []
  name: cluster-gateway
  namespace: gateway
  tls:
    enabled: false
    secretName: ""              # "" = <release>-tls
    issuer: letsencrypt-prod    # ClusterIssuer that already exists in your cluster (e.g. acme-dns DNS-01)

env:
  ENVIRONMENT: production
  # TEACH_SECRET (firma de cookies de sesión) va por Secret y es OBLIGATORIO: sin valor
  # (o con el de ejemplo, o de menos de 32 caracteres) el render falla. Setealo en values-local.
  TEACH_SECRET: ""
  # Rate limit per client, requests/min ("0" = off, the default). It needs the REAL client address:
  # with a TCP-passthrough edge (HAProxy without PROXY protocol) every visitor arrives from the same
  # address and would share ONE bucket. Turn it on only after PROXY protocol is enabled at the edge
  # and on the Gateway (gatewayAPI.enableProxyProtocol); then set TEACH_TRUST_PROXY "1" (docs/OPERATING.md).
  TEACH_RATE_API: "0"
  TEACH_RATE_SEARCH: "0"
  TEACH_TRUST_PROXY: "0"

# Generación de contenido DESDE el pod (opcional). Normalmente el contenido se
# genera local (claude/codex) y va horneado en la imagen; esto es para usar el
# LiteLLM del cluster desde adentro. apiKey va a un Secret.
llm:
  baseUrl: ""                   # ej http://litellm.litellm:4000/v1
  model: ""
  apiKey: ""

# Weekly check that the study bot's models still exist at the prices the UI
# shows. Network only — no key, no quota — which is why it fits the cluster
# while content generation does not. Free models churn; this is what notices.
checkModels:
  enabled: true
  schedule: "0 6 * * 1"   # Mondays 06:00, cluster time

# Counters for which models the study bot gets used with — anonymous by the
# shape of the data, not by policy: counters only, never rows, no timestamp per
# question, and the key space fixed by models.yaml. Nothing about the student is
# received or stored; details in teach/core/bot_stats.py.
#
# The volume is small and will stay small, but it has to exist: without it the
# counts reset on every `helm upgrade`. Disable this and the endpoint still
# answers — it simply counts into a path that does not survive, which is the
# right behaviour for a local run.
botStats:
  enabled: true
  size: 128Mi
  storageClass: longhorn
