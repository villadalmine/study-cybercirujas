# Example values-local.yaml: copy it, replace every placeholder, keep the copy out of git
# (deploy/helm/values-local.yaml is gitignored). The full procedure, with preflight,
# verification and rollback, is docs/DEPLOY.md:
#   cp deploy/helm/values-study.example.yaml deploy/helm/values-local.yaml
#   helm upgrade --install study deploy/helm -n teach-plat --create-namespace \
#     -f deploy/helm/values-local.yaml --set image.tag=vX.Y.Z
#
# What the cluster needs (only for the parts you enable):
#   - gateway.enabled: Gateway API CRDs and an existing Gateway with an HTTPS listener
#     for your host (the chart only adds an HTTPRoute to it)
#   - gateway.tls.enabled: cert-manager and a ClusterIssuer; DNS for the host
#   - botStats (on by default): a StorageClass for a 128Mi ReadWriteOnce PVC

image:
  # Public image (linux/amd64 only):  ghcr.io/villadalmine/study-cybercirujas
  # arm64 nodes or a private registry: build in-cluster with `make image-cluster`
  # and point this at <your-registry>/teach-plat
  repository: ghcr.io/villadalmine/study-cybercirujas
  # Leave the tag to the command line (--set image.tag=vX.Y.Z); never "latest".
  tag: ""
  pullPolicy: IfNotPresent

# nodeSelector:
#   kubernetes.io/hostname: <node-name>
#   # or a label you gave the nodes that can pull from your registry

gateway:
  enabled: true
  name: <your-gateway>
  namespace: <gateway-namespace>
  host: study.example.com
  extraHosts: []            # e.g. an internal name served by the same route
  tls:
    enabled: true
    secretName: study-tls
    issuer: letsencrypt-prod

env:
  ENVIRONMENT: production
  # Required, 32+ characters, not a placeholder: openssl rand -hex 32 (the render fails otherwise)
  TEACH_SECRET: "PONER-UN-SECRETO-FUERTE-DE-32-BYTES"

# botStats:
#   storageClass: ""        # "" = the cluster's default StorageClass
#   enabled: false          # no PVC; counters reset on restart (fine for a try-out)

# Optional: generate content from the pod through a LiteLLM proxy
# llm:
#   baseUrl: http://litellm.litellm:4000/v1
#   model: <model-name-in-litellm>
#   apiKey: <key>
