# Build de la imagen teach-plat con Kaniko vía Argo Workflows (in-cluster),
# mismo patrón que online-game. El repo git tiene que existir upstream primero
# (cuando publiquemos a GitHub, ajustar repo: abajo).
#
# Aplicar:   kubectl create -f deploy/build/teach-plat-kaniko.yaml
# Seguir:    kubectl logs -l app=teach-plat-build -n kaniko -f
# Después:   helm upgrade --install study deploy/helm -n teach-plat --create-namespace \
#              -f deploy/helm/values-local.yaml --set image.tag=<tag>
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: build-teach-plat-
  namespace: kaniko
  labels:
    app: teach-plat-build
spec:
  entrypoint: build-image
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 7200
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  nodeSelector:
    kubernetes.io/hostname: srv-rk1-nvme-01
  tolerations:
    - key: "node.kubernetes.io/unreachable"
      operator: Exists
      effect: NoExecute
    - key: "node.kubernetes.io/not-ready"
      operator: Exists
      effect: NoExecute
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-nvme
        resources:
          requests:
            storage: 2Gi
  templates:
    - name: build-image
      inputs:
        artifacts:
          - name: source
            path: /workspace/source
            git:
              repo: "https://github.com/villadalmine/teach-plat.git"
              revision: main
              depth: 1
      container:
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/source/deploy/Dockerfile"
          - "--context=dir:///workspace/source"
          - "--destination=registry.registry:5000/teach-plat:0.1.0"
          - "--insecure"
          - "--skip-tls-verify"
          - "--snapshot-mode=redo"
          - "--compression=zstd"
          - "--compression-level=1"
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
            ephemeral-storage: "2Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
            ephemeral-storage: "4Gi"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
