# Official documentation per project — the catalogue the auditor looks things up in.
#
# Adding a project is ONE entry. That is the point: every topic in this repo rests
# on some project's official documentation, and the set of projects grows (argocd,
# istio, cilium, whatever the next certification covers). Nothing else needs
# touching — `scripts/check_sources.py` reads this, and the auditor design in
# docs/AUDITOR_DESIGN.md consumes it as the crawl list.
#
# Seeded empirically, not guessed: measured across 4,263 citations in the
# references sections of the existing corpus (2026-08-06). Notably **zero** of
# those were blogs, Medium, StackOverflow or similar — the models have been citing
# primary sources consistently, so this catalogue records what is already true
# rather than imposing something new.
#
# Fields:
#   domains   hosts that count as official for this project. A citation from a
#             host in no project's list is not automatically wrong — it is
#             unrecognised, and that is what gets reported for a human to judge.
#   docs      documentation root, the crawl entry point.
#   versioned whether the docs are published per release. Where true, a claim
#             cannot be checked without knowing WHICH version it is about — a
#             statement true in 1.29 and false in 1.34 is the likeliest real error
#             in this corpus, and a version-blind check calls it fine.
#   spec      machine-readable ground truth, if the project publishes one. This is
#             what makes a free deterministic check possible instead of retrieval:
#             field names and apiVersions can be looked up, not inferred.

projects:

  kubernetes:
    domains: [kubernetes.io, k8s.io, kubectl.docs.kubernetes.io, kubernetes.github.io, sigs.k8s.io]
    docs: https://kubernetes.io/docs/
    versioned: true
    spec: https://raw.githubusercontent.com/kubernetes/kubernetes/release-{version}/api/openapi-spec/swagger.json

