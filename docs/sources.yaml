# Hosts that are legitimate to cite but belong to no single project, so they are
# not "unrecognised" — they just cannot be attributed. github.com is the big one:
# a project's own repository is a primary source, but the host says nothing about
# which project, so it is resolved from the path instead.
neutral_domains:
  - github.com
  - raw.githubusercontent.com
  - gitlab.com
  - opensource.org
  - creativecommons.org
  - www.iso.org
  - pkg.go.dev
  # Government and standards bodies: legitimate primary sources, but they
  # publish for many projects at once, so attributing them to one would lie.
  - media.defense.gov
  - www.cisa.gov
  - linux.die.net
  - teamtopologies.com
