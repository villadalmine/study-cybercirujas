# The pins of the CKNE GA upgrade. It moves no Kubernetes version (the GA kept the beta's objectives and the material
# names no curriculum version number), so it only pins the date a tool edit stamps and the one scripted editor the guard
# accepts: `upgrade_versions.py --scope citations` runs in the switch PR, after `curriculum_diff.py switch`, because a
# date-versioned upgrade has no upstream window to move the citations in before it (docs/upgrades/README.md, step 6).
upgrade: ckne-ga
date: '2026-11-12'          # the day the switch was prepared; what a tool edit stamps in meta.yaml (never the clock)
tool: scripts/upgrade_versions.py   # the one scripted editor the guard accepts for this upgrade
tool_sha256: bf454465606325b982ded09846842a3d7db69b9ee6a4d146152e914af5a8e2f5   # its sha256: change the script and this line moves with it (a test checks)
