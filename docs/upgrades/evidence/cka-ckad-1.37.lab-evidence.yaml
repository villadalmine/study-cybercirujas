# Where the CKA and CKAD labs were proven on Kubernetes 1.37 (#51, #103). Same shape as deploy/lab-evidence.yaml (#206):
#   <cert>/<topic>: {<target>: {date, lab_hash, evidence, runner}}, targets from deploy/lab-targets.yaml (`kind`, `k3s-incus`).
# No entry for a target means "not tested there", never "does not work". When #206 is on main these entries move there as they are.
# lab_hash of a lab now: teach.lab.kc_meta.lab_hash(spec.load(Path("certs/<cert>/<topic>/lab"), "curated")), on the tree of
# main + #201 + the lab PRs (#213, #214). `evidence` is the kept log and its sha256 (also in logs/SHA256SUMS).
# What each log shows: break, check/verify FAIL before the fix, the reference fix, check/verify PASS after it, down or cleanup.

