# tracked:       the frozen syllabus the material was built against (default certs/<cert>.md)
# target:        the new curriculum, frozen from the official PDF pinned by commit
# upstream_base: the old curriculum frozen from ITS official PDF, so the report can tell what the vendor
#                changed apart from where our frozen file already differed from its own PDF
