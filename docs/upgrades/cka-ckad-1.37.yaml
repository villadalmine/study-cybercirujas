# Upgrade spec for scripts/curriculum_diff.py plan (#63). The plan and the report next to this file are
# generated from it and from the files it names; nothing in them is written by hand.
#
#   scripts/curriculum_diff.py plan docs/upgrades/cka-ckad-1.37.yaml
#   scripts/curriculum_diff.py render docs/upgrades/cka-ckad-1.37.plan.json -o docs/upgrades/cka-ckad-1.37-plan.md
