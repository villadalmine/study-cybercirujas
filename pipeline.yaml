# Declarative content pipeline.
#
# This file is the single source of truth for WHAT the pipeline should produce.
# Scripts and CLI commands read it; nothing that drives the pipeline is written
# into a script's own list. Two hardcoded target lists used to live in
# scripts/fix_corrupted_content.py and scripts/resume-generation.sh, and both
# silently drifted out of sync with reality (three separate audit blind spots,
# see CHANGELOG 2026-07-16 / 07-28 / 07-29). Add a language here, once.
#
# Full process: WORKFLOW.md

# Languages every active certification is expected to have. Order is the order
# work is done in: Spanish first (source language), English second, and only
# then the on-demand tier — and that one only for certs that opt in below.
# Order IS the work order, and the first entry is the authoring language:
# everything is written in English first — content, exercises, labs, video
# scripts — and every other language is a TRANSLATION of it, never a separate
# authoring pass. Spanish used to be first; the corpus written before
# 2026-08-04 has independently authored Spanish and English, which is why the
# two drifted in size and structure.
#
# Honest note on the reason: no quality difference between authoring in English
# and in Spanish could be measured (identical quality-floor pass rates, 100% of
# citations resolving in both, 54/54 manifests parsing in both, comparable code
# block and heading counts). The case for English is that the source material
# and every technical term already are English, plus ~20% more material per
# token — not a demonstrated quality gain. See docs/TRANSLATION_STUDY.md.
languages:
  default: [en, es]
  on_demand: [pt, fr, de, zh, ja]

# Guard rails for unattended and batch runs. API credits are a real constraint:
# a full certification is ~26 topics x ~7 min x 2 completions, so an unbounded
# run both takes hours and can exhaust the monthly limit mid-certification.
budget:
  # Maximum topics generated per invocation. Raise deliberately, not by habit.
  topics_per_run: 2
  # Errors where retrying is pointless — stop the run instead of burning the
  # remaining budget on calls that cannot succeed.
  fatal_errors:
    - "spend limit"
    - "usage limit"
  # Errors that are transient and worth retrying. All observed in practice on
  # 2026-07-29/30 while generating cks/en.
  #
  # "below the quality floor" is here because it is retryable in the same sense:
  # the model simply produced a weak answer that one time (cks/3.1 came back
  # with no references section at all). Nothing was written — the generator
  # rejects before saving — so asking again is both safe and usually enough.
  retry_errors:
    - "529"
    - "Overloaded"
    - "500"
    - "Internal server error"
    - "below the quality floor"
    # A completion that never returned: the topic stays pending, so asking
    # again is safe and usually works.
    - "produced no answer within"
  retry_attempts: 3
  retry_delay_seconds: 60
  # Ceiling for a single completion. A topic normally takes ~3-4 minutes per
  # completion (two per topic), so this is generous — it exists only so a CLI
  # that never returns cannot stall everything behind it. Without it a hung
  # call blocks forever, and the unattended timer keeps skipping because its
  # pgrep guard sees a process that looks alive.
  completion_timeout_seconds: 900

# Stage order. Content before media, always: a video narrates content that must
# already exist and be verified. Videos are the last step and never block.
stages: [snapshot, generate, audit, status, video]

# Quality floor, applied identically to every backend.
#
# The point is that the standard does not depend on which model produced the
# material. It is enforced by the generator BEFORE writing — substandard output
# fails loudly instead of landing on disk and being marked `generated` — and by
# the audit afterwards, both reading these same numbers.
#
# Thresholds are calibrated against 270 files of verified content (cks, cka,
# ckad, lpi-010-160): content.md ranges 4577–…, median 8685; exercises.md
# starts at 1778, median 11569. The floors sit below the observed minimum so
# they never reject material that is already known good — they are a floor, not
# a target. For reference, the CNPE/CNPA run that motivated this averaged 2999
# and 1109 bytes of content per topic, roughly a ninth of the median.
#
# `requires` checks structure the prompt explicitly asks for, which is the more
# meaningful half: a topic can hit the byte count and still ship without the
# collapsible answers section that makes the exercises usable.
# NON-NEGOTIABLE: content quality comes first, cost second. A cheaper model is
# only ever acceptable where it provably does not degrade the material — never
# as a way to produce weaker content faster.
#
# This is why translating and authoring are treated differently. Authoring from
# a one-line syllabus entry is a reasoning task and its quality tracks model
# strength directly, so it stays on the strong backend. Translating restates
# material whose substance is already fixed by the source, and its failure modes
# are mechanical — summarising instead of translating, dropping sections,
# translating command flags — which `_verify_translation` checks deterministically
# (code blocks and URLs byte-identical, heading counts equal, length in band).
#
# A translation must therefore read the same regardless of which model produced
# it. Any model that cannot pass those checks is not cheaper, it is unusable.
quality:
  content:
    min_bytes: 4000
    starts_with: "#"
    requires:
      # The optional `6)` / `6.` prefix matters: the generation prompt asks for
      # the sections numbered 1) to 6), so the model sometimes titles the last
      # one "## 6) References". That is a references section by any reasonable
      # reading, but the un-prefixed pattern rejected it — and because nothing
      # is written on rejection, the topic came back pending and was retried on
      # the next pass, forever. cks 4.1 burned six full generations that way
      # (~7 min and 2 completions each) across four quota windows, which is what
      # made the quota vanish within an hour of every renewal.
      - pattern: "^#+ *(?:[0-9]+[.)]? *)?(Referencias|References|参考|参考文献|Referências|Références|Referenzen)"
        description: "a references section citing official sources"
  exercises:
    min_bytes: 1700
    starts_with: "#"
    requires:
      - pattern: "<details"
        description: "the collapsible '<details>' answers section"

# Certifications under automation.
#
#   active: false  -> declared but not part of automatic work. The audit ignores
#                     it, so a cert nobody has started does not flood the report.
#                     Flip to true when starting it, in the same commit.
#   languages:     -> overrides `languages.default` entirely when present.
#   owner:         -> which agent takes this certification by default. Ownership
#                     is NOT a lock: the per-topic claim system is what prevents
#                     two runs colliding. This is about not spending two quota
#                     windows on the same work, and it exists because prose did
#                     not hold — a stale line in AGENTS_SYNC.md ("the other 40 are
#                     yours") outlived the split that replaced it, and the other
#                     agent correctly followed what was written. `any` means
#                     whoever gets there. Override with TEACH_AGENT=<name>.
#   video:         -> languages to render the certification video in. Empty list
#                     means no video yet. Piper has voices for es, en, de and zh
#                     only (teach/core/video.py VOICES); `ja` and the rest have
#                     none, so a video in those languages is not just untranslated,
#                     it cannot be rendered at all (see BACKLOG.md).
#                     English goes first here for the same reason it does above:
#                     it is what gets authored, and the rest is translated.
# What the unattended timer is working toward — and the ONLY thing it may work
# on. Set it, and leaving the machine running has a defined end: the timer stops
# when the goal is met instead of moving on to whatever else is pending.
#
# It exists because the timer used to derive its queue from every active
# certification, i.e. it worked until nothing was pending — and that is not a
# state this repository reaches. Re-snapshotting seven LPI syllabi on 2026-08-11
# put 162 topics back in the queue in a single commit, and the timer would have
# started on all of them overnight without anyone choosing that.
#
# An EMPTY milestone means the timer generates nothing. That is deliberate: an
# unset goal must not read as "everything". Set it with
#     scripts/steer.py milestone lpic-3-305 en es
#     scripts/steer.py milestone --clear        # timer idles
milestone:
  name: lpic-3-306 in en, es
  targets:
    lpic-3-306: [en, es]
