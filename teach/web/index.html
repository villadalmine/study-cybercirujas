<title>Cert Landscape — Certificaciones IT: Linux, Kubernetes y Cloud Native</title>
<style>

  header a { opacity: .85; font-size: .93rem; }
  header a:hover { opacity: 1; text-decoration: none; color: var(--accent); }
  select { font: inherit; padding: .2rem .4rem; border: 1px solid var(--line);
           border-radius: 8px; background: Canvas; cursor: pointer; }
  main { max-width: 70rem; margin: 0 auto; padding: 1rem 1.2rem 4rem; }
  .hero { position: relative; text-align: center; padding: 3.8rem 1rem 2.6rem; }
  .hero::before { content: ""; position: absolute; inset: -40% -20% auto; height: 130%;
                  background: radial-gradient(60% 60% at 50% 30%, #4a7fd422, transparent 70%);
                  pointer-events: none; z-index: -1; }
  .hero h1 { font-size: clamp(1.8rem, 4.6vw, 3rem); margin: 0 0 .6rem; letter-spacing: -.025em;
             background: linear-gradient(92deg, var(--accent), var(--accent2));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { opacity: .8; max-width: 46rem; margin: 0 auto 1.7rem; font-size: 1.06rem; }
  .stats { display: flex; gap: 2.6rem; justify-content: center; flex-wrap: wrap; }
  .stats div { text-align: center; }
  .stats strong { display: block; font-size: 2rem; color: var(--accent); line-height: 1.2; }
  .stats span { font-size: .85rem; opacity: .7; }
  h2 { margin: 2.6rem 0 .8rem; font-size: 1.35rem; letter-spacing: -.01em; }
  h3.vendor { margin: 1.4rem 0 .1rem; font-size: 1.05rem; opacity: .9;
              border-left: 3px solid var(--accent); padding-left: .6rem; }
  .lvl { display: inline-block; font-size: .72rem; font-weight: 600; text-transform: uppercase;

         border: 1px solid var(--line); border-radius: 999px; background: var(--soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: .7rem; }
  .cert { cursor: pointer; padding: .8rem .95rem; border: 1px solid var(--line);
          border-radius: 14px; background: var(--soft);
          transition: transform .13s ease, border-color .13s ease, box-shadow .13s ease; }
  .cert:hover { transform: translateY(-2px); border-color: var(--accent);

  .cert strong { display: block; font-size: .93rem; margin-bottom: .3rem; line-height: 1.35; }
  .chip { display: inline-block; font-size: .72rem; border: 1px solid var(--line);
          border-radius: 999px; padding: 0 .5rem; margin: .16rem .25rem 0 0; opacity: .85; }
  .chip.care { border-color: var(--gold); color: var(--gold); opacity: 1; }
  .chip.req  { border-color: var(--accent); color: var(--accent); opacity: 1; }
  .topic { display: flex; gap: .8rem; align-items: baseline; padding: .55rem .4rem;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; border-radius: 8px; }
  .topic:hover { background: var(--soft); }
  .topic .id { opacity: .55; min-width: 2.4rem; font-variant-numeric: tabular-nums; }
  .topic .title { flex: 1; min-width: 12rem; }
  .topic .w { opacity: .55; font-size: .8rem; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%;
         background: var(--ok); margin-right: .4rem; }
  .dot.off { background: #888; opacity: .5; }
  .study { font-size: .85rem; white-space: nowrap; }
  .flow { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin: .8rem 0 1.7rem; }
  .stage { display: flex; flex-direction: column; gap: .45rem; }
  .node { border: 1.5px solid var(--accent); border-radius: 12px; padding: .4rem .85rem;

          max-width: 12rem; transition: background .12s ease; }
  .node:hover { background: #4a7fd422; }
  .node small { display: block; opacity: .65; font-size: .72rem; line-height: 1.25; margin-top: .1rem; }
  .arrow { font-size: 1.5rem; opacity: .55; }
  .badge { border: 1.5px solid var(--gold); border-radius: 16px; padding: 1rem 1.25rem;
           margin: 1rem 0; background: var(--soft); }
  .badge .node { border-color: var(--gold); display: inline-block; margin: .15rem .25rem .15rem 0; }
  .badge p { margin: .5rem 0; }
  .md { max-width: 46rem; }
  .md pre { overflow-x: auto; background: var(--soft); border: 1px solid var(--line);
            padding: .9rem 1rem; border-radius: 12px; line-height: 1.45; }
  .md h2, .md h3, .md h4 { margin: 1.4rem 0 .4rem; }
  .md details { border: 1px solid var(--line); border-radius: 12px; padding: .3rem 1rem;
                margin: 1rem 0; background: var(--soft); }
  .md summary { cursor: pointer; font-weight: 600; padding: .5rem 0; }
  .md details[open] summary { margin-bottom: .3rem; }
  .tablewrap { overflow-x: auto; margin: .8rem 0; }
  table { border-collapse: collapse; font-size: .9rem; }
  th, td { border: 1px solid var(--line); padding: .35rem .7rem; text-align: left; }
  th { background: var(--soft); }
  .teaser { position: relative; max-height: 26rem; overflow: hidden;
            -webkit-mask-image: linear-gradient(#000 55%, transparent);
            mask-image: linear-gradient(#000 55%, transparent); }
  .cta { border: 1.5px dashed var(--line); border-radius: 16px; text-align: center;
         padding: 2rem 1.2rem; margin: -2rem 0 1rem; position: relative; background: Canvas; }
  .cta h3 { margin: .2rem 0 .4rem; }
  .cta p { opacity: .75; max-width: 30rem; margin: 0 auto .4rem; font-size: .92rem; }
  .includes { display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap;
              margin: .8rem 0; font-size: .9rem; opacity: .85; }
  .note { font-size: .82rem; opacity: .7; border-left: 3px solid var(--gold);
          padding: .2rem .7rem; margin: .6rem 0; }
  input, button { font: inherit; padding: .48rem .75rem; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: 0;
           border-radius: 10px; transition: filter .12s ease; }
  button:hover { filter: brightness(1.1); }
  .panel { max-width: 22rem; margin: 3rem auto; border: 1px solid var(--line);
           border-radius: 16px; padding: 1.5rem; background: var(--soft); }
  .panel form { display: flex; flex-direction: column; gap: .6rem; }
  .panel input { border: 1px solid var(--line); border-radius: 10px; background: Canvas; }
  .error { color: #c34; }
  .back { display: inline-block; margin-bottom: .6rem; opacity: .8; font-size: .9rem; }
  .botgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .6rem; margin: .8rem 0; }
  .botgrid label { font-size: .8rem; opacity: .75; display: block; margin-bottom: .15rem; }
  .botgrid select, .botgrid input { width: 100%; border: 1px solid var(--line); border-radius: 8px;
                                    background: Canvas; padding: .4rem .5rem; font: inherit; }
  .botbar { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: .82rem; opacity: .8; margin: .5rem 0; }
  .msg { border: 1px solid var(--line); border-radius: 12px; padding: .7rem 1rem; margin: .7rem 0; background: var(--soft); }
  .msg.q { background: transparent; border-style: dashed; }
  table.status { border-collapse: collapse; min-width: 640px; }
  table.status td, table.status th { padding: .45rem .7rem; border-bottom: 1px solid var(--line); text-align: left; font-size: .9rem; vertical-align: top; }
  footer { border-top: 1px solid var(--line); margin-top: 3rem; padding: 1.3rem;

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(text) {
  const lines = text.split('\n');
  let html = '', inCode = false, codeIndent = '', list = null, para = [];
  const flush = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (inCode) {
      if (line.trim() === '```') { html += '</code></pre>'; inCode = false; continue; }
      const stripped = line.startsWith(codeIndent) ? line.slice(codeIndent.length) : line.replace(/^\s+/, '');
      html += esc(stripped) + '\n'; continue;
    }
    // los pasos numerados suelen traer un bloque de código indentado debajo
    // (ver certs/*/exercises.md) — no cerrar la lista al entrar en código,
    // así el <ol>/<ul> sigue numerando bien después del bloque.
    const fence = line.match(/^(\s*)```/);
    if (fence) { flush(); codeIndent = fence[1]; html += '<pre><code>'; inCode = true; continue; }
    if (/^<\/?details>$/.test(line.trim()) || /^<summary>.*<\/summary>$/.test(line.trim())) {
      flush(); closeList(); html += line.trim(); continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)/);
    if (h) { flush(); closeList(); const l = Math.min(h[1].length + 1, 6);
             html += `<h${l}>${inline(h[2])}</h${l}>`; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      flush(); closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      i--;
      html += '<div class="tablewrap"><table>' +
        rows.filter((r) => !/^[\s|:-]+$/.test(r)).map((r, idx) => {
          const tag = idx === 0 ? 'th' : 'td';
          return '<tr>' + r.trim().replace(/^\||\|$/g, '').split('|')
            .map((c) => `<${tag}>${inline(c.trim())}</${tag}>`).join('') + '</tr>';
        }).join('') + '</table></div>';
      continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) { flush(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li>${inline(line.replace(/^\s*[-*+]\s+/, ''))}</li>`; continue; }
    if (/^\s*\d+[.)]\s+/.test(line)) { flush(); if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += `<li>${inline(line.replace(/^\s*\d+[.)]\s+/, ''))}</li>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flush(); closeList(); html += '<hr>'; continue; }
    if (!line.trim()) { flush(); closeList(); continue; }
    para.push(line.trim());
  }
  flush(); closeList(); if (inCode) html += '</code></pre>';
  return html;
}

// key lives in localStorage and is sent ONLY to openrouter.ai, never here.
const BOT = { hist: [], used: { in: 0, out: 0 }, certs: null, topics: [] };
// The model catalogue comes from /api/models (models.yaml), never from a
// list typed here: the first draft hardcoded invented ids in JavaScript.
// scripts/check_models.py compares that file against OpenRouter's live API,
// so prices shown to students are verifiable rather than remembered.
let BOT_MODELS = null;
// Rough token estimate: ~4 chars per token for markdown. Shown BEFORE sending
// so the student always knows what a request will cost on their own key.
const botTokens = (s) => Math.ceil((s || '').length / 4);
const botKey = () => localStorage.getItem('or_key') || '';

// What `scripts/probe_models.py` found out by actually calling each model, and
// what the UI does with it. Phase 1 shipped a menu built from the catalogue's
// own claims, and students reported the two failures that catalogue cannot see:
// models that do not answer, and an effort selector that does nothing (or does
// something even when set to "off"). Both are now facts in models.yaml, probed
// rather than assumed, and both are honoured here.
//
//   probe: ok | flaky | broken      — did it answer when asked
//   thinking: effort | always | ignored | none | unknown
//   thinking_off: 'enabled:false'   — the switch that really stops it thinking
const botUsable = (m) => m.probe !== 'broken';
const botProbedOn = () => {
  const all = Object.values((BOT_MODELS || {}).tiers || {}).flat();
  return all.map((m) => m.probed).filter(Boolean).sort().slice(-1)[0] || '';
};

// The effort selector, told what it actually does for the chosen model. A
// control that lies is worse than no control: "No reasoning (cheapest)" was
// neither on nine of the eighteen models offered.
function botThinking() {
  const picked = $('bm').selectedOptions[0];
  const mode = picked ? picked.dataset.t : '';
  const stoppable = picked && picked.dataset.off;
  const inert = mode === 'ignored' || mode === 'none';
  $('be').disabled = inert;
  if (inert) $('be').value = '';
  $('bthink').textContent =
    inert ? t('botThinkIgnored')
    : mode === 'always' ? (stoppable ? t('botThinkAlways') : t('botThinkStuck'))
    : (mode === 'effort' || mode === 'flat') ? t('botThinkOn')
    : t('botThinkUnknown');
}

// The task harness: one specialised prompt per intent. Each knows something
// about THIS corpus, which is what keeps the model from improvising formats
// the material already defines.
const BOT_INTENTS = {
  explain: 'Explain the concept the student asks about in a different way than the material does: another angle, another analogy, another order. Cite ONLY the references already present in the material; never invent sources.',
  exercise: 'Write ONE practical exercise about what the student asks, following this corpus\' convention: a short scenario, numbered guided steps, and the solution inside a <details><summary>Solution</summary>…</details> block so the student can try first.',
  quiz: 'Ask the student 5 exam-style questions about the loaded topic, one at a time, weighted towards what the syllabus emphasises. Wait for each answer before the next, and say plainly whether the answer was right and why.',
  exam: 'Explain how this certification exam would actually test this topic: the shape of the questions, the traps, what is memorisation versus what is applied, and what a well-prepared candidate should be able to do.',
};

// Off is off, on is on — per model, from the probe.
function botReasoning() {
  const picked = $('bm').selectedOptions[0], effort = $('be').value;
  const mode = picked ? picked.dataset.t : '';
  if (effort && mode !== 'ignored' && mode !== 'none') return { reasoning: { effort } };
  // "No reasoning" chosen. A model that thinks regardless needs the explicit
  // switch; one that never thinks needs nothing; one that rejects the field
  // must not be sent it at all.
  if (!effort && mode === 'always' && picked.dataset.off) return { reasoning: { enabled: false } };
  return {};
}

async function botAsk(intent) {
  const key = botKey(), out = $('bout');
  if (!key) { out.innerHTML = `<p class="note">${t('botNoKey')}</p>` + out.innerHTML; return; }
  const q = intent ? t('bot' + intent[0].toUpperCase() + intent.slice(1)) : $('bq').value.trim();
  if (!q && !intent) return;
  if ($('bx').value !== 'none' && !$('bt').value) { out.innerHTML = `<p class="note">${t('botNoTopic')}</p>` + out.innerHTML; return; }
  const material = await botMaterial();
  const sys = [
    'You are a study assistant for IT certifications. Answer in the language of the question.',
    BOT_INTENTS[intent] || '',
    material ? 'Use ONLY the material below. If the answer is not in it, say so plainly instead of improvising.\n\n--- MATERIAL ---\n' + material : '',
  ].filter(Boolean).join('\n\n');
  const msgs = [{ role: 'system', content: sys }];
  if ($('bh').checked) msgs.push(...BOT.hist.slice(-6));
  msgs.push({ role: 'user', content: q });
  out.insertAdjacentHTML('afterbegin', `<div class="msg q">${esc(q)}</div><div class="msg" id="bnow">${t('botThinking')}</div>`);
  try {
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}`,
                 'HTTP-Referer': location.origin, 'X-Title': 'Cert Landscape study bot' },
      body: JSON.stringify(Object.assign(
        // max_tokens is not only a cap: OpenRouter derives each provider's
        // thinking budget from it, so probe_models.py probes at this exact
        // number. Change it here and the verdicts in models.yaml stop
        // describing the request this page makes.
        { model: $('bm').value, messages: msgs, max_tokens: 2000 },
        // OpenRouter's unified reasoning control, sent as what this model was
        // MEASURED to do rather than what it advertises. Omitting the field
        // does not mean "no thinking": nine of the models offered think anyway
        // and bill it as output. For those, "off" has to be said out loud.
        botReasoning())),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error((d.error && d.error.message) || r.status);
    const answer = d.choices[0].message.content;
    $('bnow').innerHTML = md(answer) +
      `<p class="note">${esc($('bm').value)}${BOT.material && BOT.material.src.length ? ' · <a href="' + esc(BOT.material.src[0]) + '" target="_blank" rel="noopener">' + t('srcOfficial') + '</a>' : ''}</p>`;
    $('bnow').removeAttribute('id');
    BOT.hist.push({ role: 'user', content: q }, { role: 'assistant', content: answer });
    const u = d.usage || {};
    BOT.used.in += u.prompt_tokens || 0; BOT.used.out += u.completion_tokens || 0;
    $('bused').textContent = (BOT.used.in + BOT.used.out).toLocaleString();
  } catch (e) {
    $('bnow').innerHTML = `<b>${t('botErr')}</b>: ${esc(String(e.message || e))}`;
    $('bnow').removeAttribute('id');
  }
}

        <td>${esc(r.built_on || '\u2013')}${r.upstream && r.upstream !== r.built_on ? ` \u2192 ${esc(r.upstream)}` : ''}</td>
        <td>${badge(r.state)}</td>
        <td>${esc(r.checked || '\u2013')}</td></tr>`).join('')}
    </table></div>`;
  window.scrollTo(0, 0);
}

async function showTopic(certId, topicId) {
  const data = await api(`/api/certs/${certId}/topics/${topicId}?lang=${LANG}`);
  const section = (title, text, bash) =>
    text ? `<h3>${title}</h3>` + (bash ? `<pre><code>${esc(text)}</code></pre>` : md(text)) : '';
  $('content').innerHTML = `
    <a class="back" onclick="go(showCert,'${certId}')">${t('backSyl')}</a>
    <h2>${data.topic.id} — ${data.topic.title}</h2>
    ${data.lang_fallback ? `<p class="note">${t('fallback')}</p>` : ''}
    ${data.generated_by && data.generated_by.model ? `<p class="note" title="EU AI Act, Art. 50">🤖 ${t('aiGen')} <code>${esc(data.generated_by.model)}</code>${data.generated_by.translated_from ? ` · ${t('aiTrans')} ${esc(data.generated_by.translated_from.toUpperCase())}` : ''} · ${esc((data.generated_by.generated_at || '').slice(0, 10))} · <a href="https://github.com/villadalmine/study-cybercirujas" target="_blank" rel="noopener">GitHub</a>${(data.generated_by.sources || []).length ? ` · ${t('srcOfficial')}: ` + data.generated_by.sources.map((s) => `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(new URL(s).hostname)}</a>`).join(' ') : ''}</p>` : ''}
    <div class="md">${md(data.content || '')}
      ${section(t('exercises'), data.exercises)}
      ${section(t('lab'), data.break_fix, true)}</div>`;
  window.scrollTo(0, 0);
}



(async () => {
  document.documentElement.lang = LANG;
  renderChrome();
  go(showLanding);
})();
</script>
</body>
