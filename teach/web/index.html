let LANG = localStorage.getItem('teach_lang')
  || (STR[(navigator.language || 'es').slice(0, 2)] ? (navigator.language || 'es').slice(0, 2) : 'es');

let VIEW = { fn: null, args: [] };
const go = (fn, ...args) => { VIEW = { fn, args }; fn(...args); };

function setLang(lang) {
  LANG = lang; localStorage.setItem('teach_lang', lang);
  document.documentElement.lang = lang;
  renderChrome();
  if (VIEW.fn) VIEW.fn(...VIEW.args);
}

function renderChrome() {
  document.querySelector('[data-nav="certs"]').textContent = t('certs');
  document.querySelector('[data-nav="paths"]').textContent = t('paths');
  document.querySelector('[data-nav="status"]').textContent = t('status');
  // innerHTML on purpose: the strings are our own constants (escaped anyway)
  // and the EU AI Act Art. 50 disclosure needs a real link to the provenance
  // (the repo carries meta.yaml per topic, MODELS.md, and the full pipeline).
  $('foot').innerHTML = esc(t('foot')) +
    ' · <a href="https://github.com/villadalmine/study-cybercirujas" target="_blank" rel="noopener">GitHub</a>' +
    ' <span style="opacity:.7">(EU AI Act Art. 50)</span>';
  $('langSel').innerHTML = Object.entries(LANG_LABELS)
    .map(([code, label]) => `<option value="${code}"${code === LANG ? ' selected' : ''}>${label}</option>`)

// ------------------------------------------------------------------ estado
let CERTS = null, PATHS = {};
const loadCerts = async () => (CERTS = CERTS || await api('/api/catalog'));
const loadPaths = async () =>
  (PATHS[LANG] = PATHS[LANG] || await api(`/api/paths?lang=${LANG}`));

const catName = { 'linux': () => t('linux'), 'cloud-native': () => t('cn'), 'general': () => t('other') };
const LEVEL_ORDER = ['essentials', 'associate', 'professional', 'specialty', 'general'];
const lvlName = { essentials: () => t('lvlEss'), associate: () => t('lvlAssoc'),
                  professional: () => t('lvlPro'), specialty: () => t('lvlSpec') };

// ------------------------------------------------------- mini render de MD
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = (s) => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(text) {
  const lines = text.split('\n');
  let html = '', inCode = false, codeIndent = '', list = null, para = [];
  const flush = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (inCode) {
      if (line.trim() === '```') { html += '</code></pre>'; inCode = false; continue; }
      const stripped = line.startsWith(codeIndent) ? line.slice(codeIndent.length) : line.replace(/^\s+/, '');
      html += esc(stripped) + '\n'; continue;
    }
    // los pasos numerados suelen traer un bloque de código indentado debajo
    // (ver certs/*/exercises.md) — no cerrar la lista al entrar en código,
    // así el <ol>/<ul> sigue numerando bien después del bloque.
    const fence = line.match(/^(\s*)```/);
    if (fence) { flush(); codeIndent = fence[1]; html += '<pre><code>'; inCode = true; continue; }
    if (/^<\/?details>$/.test(line.trim()) || /^<summary>.*<\/summary>$/.test(line.trim())) {
      flush(); closeList(); html += line.trim(); continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)/);
    if (h) { flush(); closeList(); const l = Math.min(h[1].length + 1, 6);
             html += `<h${l}>${inline(h[2])}</h${l}>`; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      flush(); closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      i--;
      html += '<div class="tablewrap"><table>' +
        rows.filter((r) => !/^[\s|:-]+$/.test(r)).map((r, idx) => {
          const tag = idx === 0 ? 'th' : 'td';
          return '<tr>' + r.trim().replace(/^\||\|$/g, '').split('|')
            .map((c) => `<${tag}>${inline(c.trim())}</${tag}>`).join('') + '</tr>';
        }).join('') + '</table></div>';
      continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) { flush(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li>${inline(line.replace(/^\s*[-*+]\s+/, ''))}</li>`; continue; }
    if (/^\s*\d+[.)]\s+/.test(line)) { flush(); if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += `<li>${inline(line.replace(/^\s*\d+[.)]\s+/, ''))}</li>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flush(); closeList(); html += '<hr>'; continue; }
    if (!line.trim()) { flush(); closeList(); continue; }
    para.push(line.trim());
  }
  flush(); closeList(); if (inCode) html += '</code></pre>';
  return html;
}

// ------------------------------------------------------------------ vistas
const examOf = (id) => { const c = CERTS[id]; return c ? c.exam : id; };
const nameOf = (id) => { const c = CERTS[id]; return c ? c.name : id; };
const certChips = (cert) =>
  (cert.vendor ? `<span class="chip">🏛 ${cert.vendor}</span>` : '') +
  (cert.exam ? `<span class="chip">📝 ${cert.exam}</span>` : '') +
  (cert.validity ? `<span class="chip">⏳ ${t('expires')}: ${cert.validity}</span>` : '') +
  (cert.requires && cert.requires.length
    ? `<span class="chip req">${t('requires')} ${cert.requires.map(nameOf).join(', ')}</span>` : '') +
  (cert.renewed_by && cert.renewed_by.length
    ? `<span class="chip care">♻ ${t('renews')} ${cert.renewed_by.map(examOf).join(' / ')}</span>` : '') +
  (cert.curriculum_updated
    ? `<span class="chip">📋 ${t('curriculum')}: ${cert.curriculum_updated}</span>` : '');



async function showLanding() {
  const certs = await loadCerts(); const paths = await loadPaths();
  // categoría → organización (LPI / Linux Foundation / CNCF) → nivel
  const byCategory = {};
  for (const [id, cert] of Object.entries(certs)) {
    const c = cert.category || 'general', v = cert.vendor || '', l = cert.level || 'general';
    const cat = (byCategory[c] = byCategory[c] || {});
    const ven = (cat[v] = cat[v] || {});
    (ven[l] = ven[l] || []).push([id, cert]);
  }
  const nPaths = Object.values(paths).filter((p) => !p.type).length;
  const nBadges = Object.values(paths).filter((p) => p.type === 'achievement').length;
  $('content').innerHTML = `
    <div class="hero">
      <h1>${t('heroTitle')}</h1>
      <p>${t('heroSub')}</p>
      <div class="stats">
        <div><strong>${Object.keys(certs).length}</strong><span>${t('sCerts')}</span></div>
        <div><strong>${nPaths}</strong><span>${t('sPaths')}</span></div>
        <div><strong>${nBadges}</strong><span>${t('sBadges')}</span></div>
      </div>
    </div>` +
    Object.keys(catName).filter((c) => byCategory[c]).map((category) => {
      const vendors = Object.keys(byCategory[category]).sort();
      return `<h2>${catName[category]()}</h2>` +
        vendors.map((vendor) =>
          // el nombre de la organización se remarca cuando conviven varias
          // en la misma categoría (ej: LPI y Linux Foundation dentro de Linux)
          (vendors.length > 1 && vendor ? `<h3 class="vendor">${vendor}</h3>` : '') +
          LEVEL_ORDER.filter((l) => byCategory[category][vendor][l]).map((level) =>
            `<div><span class="lvl">${lvlName[level] ? lvlName[level]() : level}</span></div><div class="grid">` +
            byCategory[category][vendor][level].map(([id, cert]) =>
              `<div class="cert" onclick="go(showCert,'${id}')">
                 <strong>${cert.name}</strong>${certChips(cert)}
               </div>`).join('') + '</div>'
          ).join('')
        ).join('');
    }).join('');
  window.scrollTo(0, 0);
}

const node = (id) => {
  const cert = CERTS[id] || { exam: id, name: id };
  const short = (cert.name || id).replace(/\s*\([^)]*\)\s*$/, '');
  return `<div class="node" onclick="go(showCert,'${id}')"><strong>${cert.exam}</strong>
            <small>${short}</small>
            <small>${cert.validity ? '⏳ ' + cert.validity : ''}</small></div>`;
};

async function showPaths() {
  await loadCerts(); const paths = await loadPaths();
  const entries = Object.entries(paths);
  const videos = {};
  await Promise.all(entries
    .filter(([, path]) => !path.type)
    .map(async ([slug]) => { videos[slug] = await api(`/api/paths/${slug}/video?lang=${LANG}`); }));
  let html = `<h2>🧭 ${t('paths')}</h2>`;
  for (const [slug, path] of entries) {
    if (path.type === 'achievement') {
      html += `<div class="badge"><strong>🏅 ${path.name}</strong>
                 <p>${path.description || ''}</p>
                 ${path.requires_all.map(node).join('')}
                 ${path.how_to_obtain ? `<p><em>${t('howGet')}</em> ${path.how_to_obtain}</p>` : ''}</div>`;
    } else if (path.type === 'info') {
      html += `<div class="badge"><strong>♻ ${path.name}</strong>
                 <p>${path.description || ''}</p>
                 <ul>${(path.rules || []).map((r) => `<li>${r}</li>`).join('')}</ul></div>`;
    } else {
      const video = videos[slug];
      html += `<h3>${path.name}</h3><p style="opacity:.8">${path.description || ''}</p>` +
        (video && video.available
          ? `<video controls preload="none" poster="${video.thumbnail_url || ''}"
               style="width:100%;max-width:820px;border-radius:12px;margin:.5rem 0;display:block;background:#000">
               <source src="${video.video_url}" type="video/mp4"></video>` +
             (video.lang_fallback ? `<p class="note">${t('fallback')}</p>` : '')
          : '') +
        `<div class="flow">` +
        path.steps.map((stage) =>
          `<div class="stage">${stage.map(node).join('')}</div>`
        ).join('<span class="arrow">→</span>') + '</div>';
    }
  }
  $('content').innerHTML = html;
  window.scrollTo(0, 0);
}

async function showCert(certId) {
  const [data, video] = await Promise.all([
    api(`/api/certs/${certId}`),
    api(`/api/certs/${certId}/video?lang=${LANG}`),
  ]);
  const cert = data.cert;
  $('content').innerHTML = `
    <a class="back" onclick="go(showLanding)">${t('backAll')}</a>
    <h2>${cert.name}</h2>
    <p>${certChips(cert)}</p>` +
    (video && video.available
      ? `<video controls preload="none" poster="${video.thumbnail_url || ''}"
           style="width:100%;max-width:820px;border-radius:12px;margin:.8rem 0;display:block;background:#000">
           <source src="${video.video_url}" type="video/mp4"></video>` +
        (video.lang_fallback ? `<p class="note">${t('fallback')}</p>` : '')
      : '') +
    `<div><span class="lvl">${t('syllabus')} · v${cert.tracked_version}</span></div>` +
    (data.topics.length ? '' : `<p>${t('noSyllabus')}</p>`) +
    data.topics.map((topic) =>
      `<div class="topic">
         <span class="id">${topic.id}</span>
         <span class="title"><span class="dot${topic.available ? '' : ' off'}"></span>${topic.title}</span>
         <span class="w">${topic.weight ?? ''}</span>
         ${topic.available
           ? `<a class="study" onclick="go(showTopic,'${certId}','${topic.id}')">${t('view')}</a>`
           : `<span class="study" style="opacity:.5">${t('soon')}</span>`}
       </div>`).join('');
  window.scrollTo(0, 0);
}

async function showStatus() {
  const rows = await api('/api/status');
  const badge = (s) => s === 'current' ? `<span style="color:#2e7d32">\u2705 ${t('stCurrent')}</span>`
    : s === 'outdated' ? `<span style="color:#c62828">\u26a0\ufe0f ${t('stOutdated')}</span>`
    : `<span style="opacity:.6">\u2013 ${t('stUnknown')}</span>`;
  $('content').innerHTML = `
    <h2>${t('stTitle')}</h2>
    <p class="note">${t('stIntro')}</p>
    <div style="overflow-x:auto"><table class="status">
      <tr><th></th><th>${t('stTopics')}</th><th>${t('stLangs')}</th><th>${t('stVideos')}</th><th>${t('stVersion')}</th><th>${t('stState')}</th><th>${t('stChecked')}</th></tr>
      ${rows.map((r) => `<tr>
        <td><b>${esc(r.name || r.id)}</b><br><span class="note">${esc(r.exam || '')}${r.vendor ? ' \u00b7 ' + esc(r.vendor) : ''}</span></td>
        <td>${r.generated}/${r.topics}</td>
        <td>${r.langs.map((l) => l.toUpperCase()).join(' ') || '\u2013'}</td>
        <td>${r.videos.map((l) => l.toUpperCase()).join(' ') || '\u2013'}</td>
        <td>${esc(r.built_on || '\u2013')}${r.upstream && r.upstream !== r.built_on ? ` \u2192 ${esc(r.upstream)}` : ''}</td>
        <td>${badge(r.state)}</td>
        <td>${esc(r.checked || '\u2013')}</td></tr>`).join('')}
    </table></div>`;
  window.scrollTo(0, 0);
}

async function showTopic(certId, topicId) {
  const data = await api(`/api/certs/${certId}/topics/${topicId}?lang=${LANG}`);
  const section = (title, text, bash) =>
    text ? `<h3>${title}</h3>` + (bash ? `<pre><code>${esc(text)}</code></pre>` : md(text)) : '';
  $('content').innerHTML = `
    <a class="back" onclick="go(showCert,'${certId}')">${t('backSyl')}</a>
    <h2>${data.topic.id} — ${data.topic.title}</h2>
    ${data.lang_fallback ? `<p class="note">${t('fallback')}</p>` : ''}
    ${data.generated_by && data.generated_by.model ? `<p class="note" title="EU AI Act, Art. 50">🤖 ${t('aiGen')} <code>${esc(data.generated_by.model)}</code>${data.generated_by.translated_from ? ` · ${t('aiTrans')} ${esc(data.generated_by.translated_from.toUpperCase())}` : ''} · ${esc((data.generated_by.generated_at || '').slice(0, 10))} · <a href="https://github.com/villadalmine/study-cybercirujas" target="_blank" rel="noopener">GitHub</a></p>` : ''}
    <div class="md">${md(data.content || '')}
      ${section(t('exercises'), data.exercises)}
      ${section(t('lab'), data.break_fix, true)}</div>`;
  window.scrollTo(0, 0);
}



(async () => {
  document.documentElement.lang = LANG;
  renderChrome();
  go(showLanding);
})();
</script>
