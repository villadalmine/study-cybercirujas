# The repo's labels, as code: the single source. Edit this file in a PR; the "Sync labels" workflow
# applies it (renames through `aliases` keep the issues). `make labels-check` (scripts/check_labels.py)
# fails when a form, the labeler, a workflow or check_pr.py names a label that is not here.
# Format: EndBug/label-sync (name, color, description <= 100 chars, aliases). Rules: CONTRIBUTING -> Labels.
# Labels that CI sets (scope:*, site:*, type:* and lang:* by path) are never set by hand.
- name: "type:bug"
  color: "1d76db"
  description: "Something is broken"
  aliases: ["bug"]
- name: "type:feature"
  color: "1d76db"
  description: "New capability or improvement"
  aliases: ["enhancement"]
- name: "type:content"
  color: "1d76db"
  description: "Topic content, exercises or translation"
- name: "type:lab"
  color: "1d76db"
  description: "A lab under certs/*/lab"
- name: "type:video"
  color: "1d76db"
  description: "Video material"
- name: "type:docs"
  color: "1d76db"
  description: "Documentation only"
  aliases: ["documentation"]
- name: "type:code"
  color: "1d76db"
  description: "teach/, scripts/, tests/, deploy/"
- name: "type:ci"
  color: "1d76db"
  description: "CI: .github/ and checks"
- name: "type:question"
  color: "1d76db"
  description: "Support question: answer, then close or move to Discussions"
  aliases: ["question"]
- name: "type:rfc"
  color: "1d76db"
  description: "Proposal that changes how the project works (GOVERNANCE)"
- name: "area:cncf"
  color: "bfdadc"
  description: "Kubernetes / CNCF certifications"
- name: "area:linux"
  color: "bfdadc"
  description: "Linux / LPI / LF certifications"
- name: "area:cloud"
  color: "bfdadc"
  description: "AWS, Azure, Google, Terraform certifications"
- name: "area:ai"
  color: "bfdadc"
  description: "AI certifications and AI-backend generation"
- name: "area:site"
  color: "bfdadc"
  description: "teach app, API, deploy, image"
- name: "area:labs-infra"
  color: "bfdadc"
  description: "Lab runners, exporters, Killercoda, spec (not a lab's content)"
- name: "area:quality"
  color: "bfdadc"
  description: "Quality score, groundedness, graph, provenance"
- name: "priority:high"
  color: "b60205"
  description: "Broken main, security, data loss, blocks the next release"
- name: "priority:medium"
  color: "d93f0b"
  description: "Planned for the next release"
- name: "priority:low"
  color: "0e8a16"
  description: "Backlog; welcome from contributors"
- name: "severity:high"
  color: "b60205"
  description: "Severity of a review finding (only with from-review)"
- name: "severity:medium"
  color: "d93f0b"
  description: "Severity of a review finding (only with from-review)"
- name: "severity:low"
  color: "fef2c0"
  description: "Severity of a review finding (only with from-review)"
- name: "from-review"
  color: "fbca04"
  description: "Follow-up found by a code review"
- name: "scope:small"
  color: "5319e7"
  description: "Change scope (deterministic, see change_rules.yaml)"
- name: "scope:medium"
  color: "5319e7"
  description: "Change scope (deterministic, see change_rules.yaml)"
- name: "scope:large"
  color: "5319e7"
  description: "Change scope (deterministic, see change_rules.yaml)"
- name: "scope:exam-version"
  color: "5319e7"
  description: "Change scope (deterministic, see change_rules.yaml)"
- name: "size-exception"
  color: "fbca04"
  description: "Maintainer waiver: more than 400 changed lines of code (CONTRIBUTING)"
- name: "scope-exception"
  color: "fbca04"
  description: "Maintainer waiver: several topics/labs, or material + code (CONTRIBUTING)"
- name: "site:none"
  color: "0e8a16"
  description: "Set by scripts/check_pr.py from the changed files: no image rebuild"
- name: "site:image-rebuild"
  color: "d93f0b"
  description: "Set by scripts/check_pr.py from the changed files: image rebuild"
- name: "lang:en"
  color: "c5def5"
  description: "Language of the changed material"
- name: "lang:es"
  color: "c5def5"
  description: "Language of the changed material"
- name: "lang:other"
  color: "c5def5"
  description: "Language of the changed material"
- name: "triage:needed"
  color: "bfd4f2"
  description: "Not looked at by a maintainer yet"
- name: "triage:needs-info"
  color: "fbca04"
  description: "Waiting for the author (14 days)"
  aliases: ["needs-info"]
- name: "status:blocked"
  color: "6a737d"
  description: "Waiting on something external; link it in a comment"
- name: "lifecycle:stale"
  color: "ededed"
  description: "No activity; will close unless someone answers"
- name: "lifecycle:frozen"
  color: "0075ca"
  description: "Never marked stale"
- name: "good first issue"
  color: "7057ff"
  description: "Small, explained, tests ready; a maintainer will mentor"
- name: "help wanted"
  color: "008672"
  description: "Agreed work where outside help is welcome"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked (link it)"
- name: "autorelease: pending"
  color: "ededed"
  description: "release-please: its open Release PR (do not set by hand; it finds the PR by this label)"
- name: "autorelease: tagged"
  color: "ededed"
  description: "release-please: a merged Release PR that already has its tag (do not set by hand)"
