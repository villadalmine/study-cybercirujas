name: Content error
description: Something in the study material is wrong or outdated
labels: ["type:content", "triage:needed"]
body:
  - type: dropdown
    id: exam_version
    attributes:
      label: Is this about a new exam curriculum version?
      description: A new version of the exam (for example CKA 1.35 to 1.37) is not a content error. If it is, choose the second answer and open the "New exam curriculum version" form instead.
      options:
        - "No, one fact in the material is wrong or outdated"
        - "Yes, the exam body published a new curriculum version (stop here and use the New exam curriculum version form)"
    validations: {required: true}
  - type: input
    id: where
    attributes:
      label: Certification, topic and language
      placeholder: "cka 1.1 es"
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Quote the sentence, command or manifest.
    validations: {required: true}
  - type: input
    id: source
    attributes:
      label: Official source that shows it
      description: Vendor or project documentation. The link is what makes a report actionable.
      placeholder: https://kubernetes.io/docs/...
    validations: {required: true}
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction (optional)
