name: validate-lab
description: >
  Validate study labs (lab.yaml v2 schema + break/verify/cleanup contract) in any
  repository. Static only: it never runs the lab scripts.
  Usage from another repo:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - uses: villadalmine/study-cybercirujas/.github/actions/validate-lab@main
      with:
        path: labs
inputs:
  path:
    description: Folder with one lab (lab.yaml) or a tree of labs.
    required: false
    default: .
  strict:
    description: Fail when a lab does not offer break, verify and cleanup.
    required: false
    default: "true"
  report:
    description: Optional path for a JSON report.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.12'
    - name: Install validator deps
      shell: bash
      run: python -m pip install -q "pyyaml>=6" "jsonschema>=4.10"
    - name: Validate labs
      shell: bash
      env:
        STUDY_ROOT: ${{ github.action_path }}/../../..
        LAB_PATH: ${{ inputs.path }}
        STRICT: ${{ inputs.strict }}
        REPORT: ${{ inputs.report }}
      run: |
        args=(validate "$LAB_PATH")
        [ "$STRICT" = "true" ] && args+=(--strict)
        [ -n "$REPORT" ] && args+=(--report "$REPORT")
        PYTHONPATH="$STUDY_ROOT" python -m teach.lab "${args[@]}"
