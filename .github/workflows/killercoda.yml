name: Killercoda export

# Runs the exporter and reports whether the generated tree differs from the Killercoda mirror.
# Read-only on purpose: it never pushes. Publishing is a manual step (docs/RUN-A-LAB-ANYWHERE.md).

on:
  pull_request:
    paths: ['certs/**/lab/**', 'teach/lab/export_killercoda.py', 'teach/lab/kc_meta.py', 'deploy/killercoda/**', '.github/workflows/killercoda.yml']
  push:
    branches: [main]
    paths: ['certs/**/lab/**', 'teach/lab/export_killercoda.py', 'teach/lab/kc_meta.py', 'deploy/killercoda/**', '.github/workflows/killercoda.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  killercoda-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRROR: ${{ vars.KILLERCODA_MIRROR || 'villadalmine/study-cybercirujas-killercoda' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # the metadata records the last commit that touched each lab
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r requirements.lock && python -m pip install -q --no-deps -e .
      - name: Stale lab evidence (warns, never fails)
        run: python -m teach.lab.kc_scope
      - name: Guardrails on the generated scenarios (schema, references, scripts, syllabus objective)
        run: scripts/study-lab export --target killercoda --all --check
      - name: Scenario diff against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}   # through the environment, never interpolated into the script text
        run: |
          git worktree add -q /tmp/base "origin/${BASE_REF}"
          # head's exporter on the base's labs and syllabus: the diff is what this PR changes in what Killercoda would show
          STUDY_REPO=/tmp/base scripts/study-lab export --target killercoda --all --out /tmp/base-tree >/dev/null || true
          scripts/study-lab export --target killercoda --all --out /tmp/head-tree >/dev/null
          { echo "### Killercoda scenarios changed by this PR"; echo '```diff'; diff -ru /tmp/base-tree /tmp/head-tree | head -300 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Export twice, output must be byte-identical
        run: |
          scripts/study-lab export --target killercoda --all --out build/killercoda | tail -1
          scripts/study-lab export --target killercoda --all --out build/killercoda-2 >/dev/null
          diff -r build/killercoda build/killercoda-2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: killercoda-tree
          path: build/killercoda
      - name: Compare with the mirror
        env:
          TOKEN: ${{ secrets.KILLERCODA_MIRROR_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No KILLERCODA_MIRROR_READ_TOKEN secret (read-only, optional): mirror not compared. Download the artifact, or run 'make killercoda-diff'."
            exit 0
          fi
          git -c http.extraHeader="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            clone -q --depth 1 "https://github.com/$MIRROR.git" mirror
          if diff -rq -x .git -x .github -x README.md -x CONTRIBUTING.md -x CODEOWNERS -x .gitattributes build/killercoda mirror > diff.txt; then
            echo "Mirror is up to date." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "Mirror differs from the export (publish: make killercoda-export, then push; docs/RUN-A-LAB-ANYWHERE.md):"; head -50 diff.txt; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
