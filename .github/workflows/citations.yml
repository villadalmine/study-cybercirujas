name: Citations

on:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - 'scripts/check_citations.py'
      - 'tests/test_check_citations.py'
      - '.github/workflows/citations.yml'
      - 'docs/sources.yaml'
      - 'certs/*/*/*/content.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: citations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  citation-rot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r requirements.lock
          .venv/bin/pip install -q --no-deps -e .
      - name: Tests
        run: .venv/bin/python3 -m unittest tests.test_check_citations -v
      - name: Check changed topics (offline)
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/python3 scripts/check_citations.py --offline --mode warn \
            --base "origin/${{ github.base_ref || 'main' }}" --json citation-rot.json --issue-body citation-rot.md
          cat citation-rot.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit corpus citations and sync single rot issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python3 scripts/check_citations.py --mode warn --json citation-rot.json --issue-body citation-rot.md
          cat citation-rot.md >> "$GITHUB_STEP_SUMMARY"
          broken=$(jq '.broken | length' citation-rot.json)
          id=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq '.[] | select((.body // "") | startswith("<!-- citation-rot -->")) | .number' | head -1)
          if [ "$broken" -gt 0 ]; then
            if [ -n "$id" ]; then
              gh issue edit "$id" --body-file citation-rot.md >/dev/null
            else
              gh issue create --title "quality: citation rot report" --body-file citation-rot.md \
                --label "area:quality" --label "type:bug" >/dev/null
            fi
          elif [ -n "$id" ]; then
            gh issue close "$id" --comment "All cited URLs now resolve." >/dev/null
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: citation-rot
          path: citation-rot.json
          if-no-files-found: ignore
