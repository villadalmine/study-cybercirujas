name: Graph

# Keeps the committed code graph (graphify-out/) in step with main, so a PR
# never has to rebase or rebuild it just to refresh the map.
#
# After a push to main that touches what the graph covers, this job asks
# scripts/check_graph.py whether the graph is stale. Only if it is does it
# rebuild (`make graph`: tree-sitter AST + derived wiki — no LLM, no quota, no
# network beyond pip) and open or update ONE pull request from the fixed
# branch bot/graph-refresh. main is protected (required checks, linear
# history, PRs only), so nothing is ever pushed to it directly.
#
# Idempotent: a fresh graph does nothing; a second run on the same commit
# finds nothing to change, so no new PR and no new commit. The merge of the
# bot PR touches only graphify-out/, which this trigger ignores, so there is
# no loop.
#
# THE CHECKS ON THE BOT PR, WITH NO SECRET (#38, #42). A pull request opened
# with the built-in GITHUB_TOKEN starts no pull_request/push workflows (GitHub's
# rule, to stop loops; a close/reopen by the same token only creates runs that
# stop at action_required, measured on a throwaway branch). workflow_dispatch is
# the documented exception, so the last step dispatches verify.yml on
# bot/graph-refresh and waits for it. But the check runs of a dispatched run are
# not associated with the PR: the PR shows no checks and stays BLOCKED
# (measured: the PR's status rollup is empty). A check run created through the
# Checks API with head_branch set IS associated with the PR and counts for
# branch protection (app github-actions, the same app the required checks name;
# measured: isRequired=true, mergeStateStatus UNSTABLE/CLEAN instead of
# BLOCKED), also on a PR that already exists and on a new head after a force
# push. So the last step copies the verdict of the dispatched run's own jobs
# (verify, e2e, pr-format) onto the PR head as check runs of the same names. It
# never invents a verdict: no run, a missing job or anything but success is
# posted as failure. No PAT, no App, nothing for a developer to configure. One
# repository setting is needed once: Settings > Actions > General > "Allow
# GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]
    paths:
      - 'teach/**'
      - 'scripts/**'
      - 'tests/**'
      - '.graphifyignore'
      - 'Makefile'
      - '.github/workflows/graph.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write      # to dispatch verify.yml on the bot branch
  checks: write       # to report its verdict on the PR head (Checks API)

concurrency:
  # Queue, never cancel: a half-finished branch update is worse than waiting.
  group: graph-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # rebuild + the dispatched verify (about 7 min) it waits for
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_graph diffs against the commit the graph was built from

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify (the version pinned in the Makefile)
        run: |
          version="$(sed -n 's/^GRAPHIFY_VERSION *:= *//p' Makefile)"
          test -n "$version"
          python3 -m venv .venv
          .venv/bin/pip install -q "graphifyy==$version"
          .venv/bin/graphify --help >/dev/null

      - name: Is the graph stale?
        id: stale
        # --regenerate --strict: rebuild in a temp copy and compare with the
        # committed graph; exit 1 on any difference (or a missing graph).
        run: |
          if .venv/bin/python3 scripts/check_graph.py --regenerate --strict; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the graph
        if: steps.stale.outputs.stale == 'true'
        run: make graph

      - name: Open or update the pull request
        if: steps.stale.outputs.stale == 'true'
        # peter-evans/create-pull-request v8.1.1, pinned by commit SHA.
        # It force-updates the branch and the open PR, and does nothing when
        # the rebuilt files equal what is on main.
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ github.token }}
          branch: bot/graph-refresh
          base: main
          add-paths: graphify-out/
          commit-message: |
            chore(graph): regenerate code graph

            Agent: graph-bot
            Model: none
          title: 'chore(graph): regenerate code graph'
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          body: |
            ## What and why

            Regenerates `graphify-out/` (graph, report, wiki) from main, because
            `scripts/check_graph.py` reported it stale. Opened by
            `.github/workflows/graph.yml`; one PR, updated in place on every
            later push to main. Tree-sitter AST only: no LLM, no cost.

            ## Kind

            code — area (ci)
            - Site: none

            ## Provenance

            - Author: ai
            - Backend: none
            - Model: none
            - Date: generated
            - Cost: none
            - Official source: graphifyy, the version pinned as GRAPHIFY_VERSION in the Makefile

            ## Evidence

            `make graph` on main, in the workflow run that opened this PR.

            ### Where it ran

            - CI: the verify run on this PR's head commit (the Graph workflow run that opened it is linked from the Actions tab)

            ### Known gaps

            Generated files are reviewed by their generator, not by line. Curated community names
            are kept; new communities arrive unnamed until a maintainer names them.

            ## Authorship

            | Role | Who | What | Link |
            | :--- | :--- | :--- | :--- |
            | Author | AI: graph-bot · none | generated by `make graph` | |
            | Approval and merge | maintainer (human) | pending | |

            ### Findings ledger

            | # | Found by | Head | Severity | Finding | Fixed by | Fix | Verified by | Status |
            | :- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

            ## How to test it from a clean clone

            ```bash
            git fetch origin bot/graph-refresh && git checkout bot/graph-refresh
            python3 scripts/check_graph.py --regenerate --strict
            ```

            ## Risk and rollback

            Only `graphify-out/` changes. Revert this PR to go back.

            ## Depends on

            nothing

      - name: Run the required checks on the bot branch and report them on the PR
        # Skipped when create-pull-request changed nothing (no PR or commit).
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/graph-refresh
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          test -n "$SHA"
          gh workflow run verify.yml --ref "$BRANCH"
          run=""
          for _ in $(seq 1 36); do
            run="$(gh run list --workflow verify.yml --branch "$BRANCH" --event workflow_dispatch \
                     --limit 20 --json databaseId,headSha \
                     --jq "map(select(.headSha == \"$SHA\")) | .[0].databaseId // empty")"
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -n "$run" ]; then
            echo "dispatched verify run: $run"
            gh run watch "$run" --interval 20 > /dev/null || true
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --paginate \
                      --jq '.jobs[] | {name, conclusion, html_url}' | jq -s .)"
          else
            echo "::warning::no dispatched verify run found for $SHA"
            jobs='[]'
          fi
          status=0
          for name in verify e2e pr-format; do
            conclusion="$(jq -r --arg n "$name" '[.[] | select(.name == $n)][0].conclusion // "missing"' <<< "$jobs")"
            url="$(jq -r --arg n "$name" '[.[] | select(.name == $n)][0].html_url // empty' <<< "$jobs")"
            [ -n "$url" ] || url="https://github.com/$GITHUB_REPOSITORY/actions/runs/${run:-$GITHUB_RUN_ID}"
            result=failure
            [ "$conclusion" = success ] && result=success || status=1
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$name" -f head_sha="$SHA" -f head_branch="$BRANCH" \
              -f status=completed -f conclusion="$result" -f details_url="$url" \
              -f "output[title]=$name: $conclusion" \
              -f "output[summary]=Copied from the job '$name' of the verify.yml run dispatched on this head commit ($SHA): $url. The job result was '$conclusion'." \
              --jq '"\(.name) -> \(.conclusion)"'
          done
          exit $status
