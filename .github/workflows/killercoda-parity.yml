name: Killercoda parity

# Runs each generated scenario the way Killercoda does, on an Ubuntu 24.04 VM (a GitHub-hosted runner is one) where
# the job is root, and uploads tested.json: the evidence the publish gate asks for (docs/RUN-A-LAB-ANYWHERE.md).
# k8s family: a kubeadm cluster like the one measured on Killercoda (kubeadm 1.36.1, Cilium, containerd 2.2, local-path;
# deploy/killercoda/killercoda_envs.yaml), limited to 1 CPU like the real image.

on:
  pull_request:
    paths: ['certs/**/lab/**', 'teach/lab/export_killercoda.py', 'teach/lab/kc_test.py', 'deploy/killercoda/**', '.github/workflows/killercoda-parity.yml']
  push:
    branches: [main]
    paths: ['certs/**/lab/**', 'teach/lab/export_killercoda.py', 'teach/lab/kc_test.py', 'deploy/killercoda/**', '.github/workflows/killercoda-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      labs: ${{ steps.plan.outputs.labs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r requirements.lock && python -m pip install -q --no-deps -e .
      - id: plan
        # The matrix is data: every lab that can be proven (a file in deploy/killercoda/fixes/, or a `fix)` verb in the script of a
        # certification in `scope:` of deploy/killercoda/tracks.yaml). No lab or certification is named in this file.
        run: |
          labs=$(python -m teach.lab test --target killercoda --plan 2>plan.err) || { cat plan.err; exit 1; }
          cat plan.err
          grep '^::warning' plan.err | sed 's/^::warning title=/- /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "labs=$labs" >> "$GITHUB_OUTPUT"

  killercoda-parity:
    needs: parity-plan
    if: needs.parity-plan.outputs.labs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Killercoda is an optional publishing channel (RFC #210): a lab failing here never fails a PR. The steps that can fail are
    # `continue-on-error`, so the check stays green and a warning names the lab (a job-level flag would leave a red check).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.parity-plan.outputs.labs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r requirements.lock && python -m pip install -q --no-deps -e .
      - name: One CPU like Killercoda (measured 1 CPU, 2.2 GB; a runner has 4 CPU, 16 GB and its RAM cannot be lowered)
        run: |
          for c in /sys/devices/system/cpu/cpu[1-9]*/online; do echo 0 | sudo tee "$c" >/dev/null || true; done
          nproc
      - name: kubeadm cluster like Killercoda's (k8s family)
        id: env
        continue-on-error: true
        if: matrix.image == 'kubernetes-kubeadm-1node'
        run: |
          # never a here-string of a command substitution into `read`: it hides a failing --print-env. Exit 2 = no Cilium release validated for today's
          # Kubernetes: the k8s family is skipped with a warning (it is not published either); any other failure fails.
          rc=0; envline=$(python -m teach.lab test --target killercoda --print-env ${{ matrix.image }} 2>env.err) || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=${{ matrix.lab }} not proven::$(cat env.err)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$rc" -eq 0 ] || { cat env.err; exit "$rc"; }
          read -r patch cilium containerd <<<"$envline"
          sudo bash deploy/killercoda/bootstrap-kubeadm.sh "$patch" "$cilium" "$containerd"
      - name: Prove the scenario (break, verify fails, fix, verify passes, cleanup)
        id: prove
        continue-on-error: true
        if: steps.env.outputs.skip != 'true' && steps.env.outcome != 'failure'
        run: sudo -E env HOME=/root KUBECONFIG=/root/.kube/config "$(which python)" -m teach.lab test --target killercoda --evidence evidence ${{ matrix.lab }}
      - name: Say it when the lab did not pass
        if: steps.prove.outcome == 'failure' || steps.env.outcome == 'failure'
        run: echo "::warning title=${{ matrix.lab }} not proven on Killercoda::this lab stays loaded-untested; an optional channel never fails a PR" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Evidence
        if: always()
        run: |
          [ -d evidence ] || { echo "no evidence: the scenario was not proven (skipped or failed before Prove)"; exit 0; }
          sudo chown -R "$USER" evidence 2>/dev/null || true
          find evidence -name tested.json -exec sh -c 'echo "### $1" >> "$GITHUB_STEP_SUMMARY"; echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"; cat "$1" >> "$GITHUB_STEP_SUMMARY"; echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' _ {} \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: tested-${{ strategy.job-index }}
          path: evidence
