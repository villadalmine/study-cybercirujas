name: Verify

# The checks that cost no API budget, run on every push and pull request.
#
# `make verify` was green and free from the start, but nothing ran it: it
# happened when someone remembered. That is the change-failure-rate side of
# DORA left to goodwill, and it makes the contribution story in DEVELOPERS.md
# untrue for anyone who is not the owner — a stranger's pull request had no way
# to be told it broke something.
#
# Deliberately NOT here: anything that spends quota (no generation, no
# translation, no check_claims), anything needing the cluster (no image build —
# docker.yml does that), and the network checks (check_citations,
# check_api_facts), which are honest to run but flaky against third-party sites
# and would train people to ignore a red build.

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs pr-format when the title or description changes;
    # without it a corrected description stayed red and an edited one kept
    # the old green verdict (review on #1). `labeled`/`unlabeled` re-run it
    # when a maintainer sets scope-exception or size-exception (review of
    # #3). verify, e2e and where-it-ran skip all three: the code did not change.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes the older run irrelevant; cancel it rather than queue.
  # A description edit or a label must not cancel a code run on the same ref.
  group: verify-${{ github.ref }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'code' }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e .

      - name: Verify
        # One definition, in the Makefile: `make verify-ci` is `make verify`
        # minus the checks that describe the owner's workstation rather than
        # the commit (installed systemd units, the local usage log, rendered
        # videos, the optional code graph). A contributor runs the same target
        # locally and gets the same verdict.
        run: make verify-ci

      - name: Secrets
        # The same shapes the pre-commit hook refuses, in case a clone never
        # ran `git config core.hooksPath .githooks`. Word-anchored: an AWS
        # example id containing "task-VZ7X" is not a key, and neither is the
        # OpenSSH `sk-ssh-ed25519` key TYPE.
        run: |
          if git grep -nE '\b(sk-[A-Za-z0-9_-]{20,}|sk-or-v1-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,})' \
               -- . ':!*.lock' | grep -v 'sk-ssh-'; then
            echo "::error::Something matching an API key shape is committed. Rotate it if it was ever pushed."
            exit 1
          fi
          echo "No key-shaped strings found."

  e2e:
    # The newcomer's path, end to end: clone, make setup, make serve, the
    # site, the API, the CLI, and a break-and-fix lab in Docker. Slow (a pip
    # install and a container), so it runs beside verify rather than inside it.
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the script clones this checkout; a full history clones cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone and run, as a newcomer would
        run: make test-e2e

  pr-format:
    # The PR description is part of the change: required sections, a
    # Conventional Commit title, the site impact (computed from the files,
    # declared in the PR), and declared provenance that matches the meta.yaml
    # of every topic the PR touches. Offline, no model. Labels the PR
    # site:none or site:image-rebuild with the built-in token — no bot.
    # Also on workflow_dispatch, but only for the graph bot's branch: a PR
    # opened with GITHUB_TOKEN starts no workflows, so graph.yml dispatches this
    # file on bot/graph-refresh, and the check runs land on that head commit
    # under the same names branch protection requires (verify, e2e, pr-format).
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'bot/graph-refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read          # the cited run and its jobs (needed if the repository is private)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Which pull request
        # pull_request: the event says. workflow_dispatch (graph bot only):
        # look the PR up by its branch and rebuild the event payload from it.
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            {
              echo "number=${{ github.event.pull_request.number }}"
              echo "head=${{ github.event.pull_request.head.sha }}"
              echo "base=${{ github.base_ref }}"
              echo "event=$GITHUB_EVENT_PATH"
            } >> "$GITHUB_OUTPUT"
          else
            # REST, not `gh pr view`: the exemption needs user.login ("github-actions[bot]")
            # and head.repo, which `gh pr view` renders differently ("app/github-actions").
            gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
              -f state=open --jq '.[0]' > pr.json
            test "$(jq -r .number pr.json)" != null
            jq '{pull_request: {number, title, body, user: {login: .user.login}, head: {ref: .head.ref, repo: {full_name: .head.repo.full_name}}, base: {ref: .base.ref, repo: {full_name: .base.repo.full_name}}, labels: [.labels[] | {name}]}}' pr.json > "$RUNNER_TEMP/event.json"
            {
              echo "number=$(jq -r .number pr.json)"
              echo "head=$(git rev-parse HEAD)"
              echo "base=$(jq -r .base.ref pr.json)"
              echo "event=$RUNNER_TEMP/event.json"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Check the PR description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pyyaml
          # Labels read live, not from the payload: "Re-run jobs" replays the
          # original event, which may predate a waiver label.
          gh api "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/labels" \
            --jq '.[].name' > labels.txt || rm -f labels.txt
          python3 scripts/check_pr.py --event "${{ steps.pr.outputs.event }}" --labels-file labels.txt \
            --base "origin/${{ steps.pr.outputs.base }}" \
            --label-file site-label.txt --runs-file cited-runs.txt
      - name: Check the run cited under "Where it ran"
        # check_pr.py stays offline; this step is its one networked mode, with
        # the job's own token. At least one cited run must be of this
        # repository, on the PR's current head commit, from verify.yml on a
        # pull_request event, with its `verify` and `e2e` jobs green. The jobs,
        # not the run: the run that proves the code also contains this very
        # job, which was red until the link was pasted (found on #3, run
        # 38683552353). The workflow, not only the job names: a PR could add
        # a workflow with jobs named verify/e2e (review of #3). pr-format runs
        # from the PR branch, so a PR that edits .github/ is still read by the
        # maintainer. A new push makes the old link stale on purpose.
        if: always() && hashFiles('cited-runs.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_pr.py --verify-runs cited-runs.txt \
            --repo "${{ github.repository }}" --head "${{ steps.pr.outputs.head }}"
      - name: Label the site impact
        # Runs even when the description check fails: the label is a fact
        # about the files. A fork's token cannot write labels; that is fine.
        if: always() && hashFiles('site-label.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="$(cat site-label.txt)"
          other=$([ "$label" = "site:none" ] && echo "site:image-rebuild" || echo "site:none")
          gh label create "$label" --force --color "$([ "$label" = "site:none" ] && echo 0e8a16 || echo d93f0b)"             --description "set by scripts/check_pr.py from the changed files"
          gh pr edit "${{ steps.pr.outputs.number }}" --add-label "$label" --remove-label "$other" ||             gh pr edit "${{ steps.pr.outputs.number }}" --add-label "$label"

  where-it-ran:
    # After verify and e2e pass on a new head, post (or update) one comment
    # with the exact line for the description's "Where it ran" subsection.
    # Our own Actions token, no external bot. The author still pastes it:
    # the description is the record, and pr-format checks what it says.
    if: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true      # a fork's token cannot comment; the check still works
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- where-it-ran -->'
          body="$marker
          **Where it ran** — paste this into the description, under *Evidence → Where it ran*:

          \`\`\`
          - CI: https://github.com/$REPO/actions/runs/$RUN — verify and e2e green on head \`${SHA:0:7}\`
          \`\`\`"
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
