name: Killercoda publish

# On a merge to main that changes labs or the exporter: prove every scenario that has a reference fix (parity test, on
# Ubuntu 24.04 VMs), then export ONLY what passed and push it to the mirror, which Killercoda syncs through its webhook.
# No evidence, no publish. Idempotent: a tree identical to the mirror makes no commit.
# The deploy key (write access to the mirror only) is a secret used by the last job only.

on:
  push:
    branches: [main]
    paths: ['certs/**/lab/**', 'teach/lab/export_killercoda.py', 'teach/lab/kc_meta.py', 'teach/lab/kc_test.py', 'deploy/killercoda/**', '.github/workflows/killercoda-publish.yml']
  workflow_dispatch:
    inputs:
      today:
        description: 'YYYY-MM-DD: plan as if it were that day (dry run of the environment schedule, e.g. after the 1.37 switch)'
        required: false

permissions:
  contents: read

concurrency:
  group: killercoda-publish
  cancel-in-progress: false

env:
  MIRROR: villadalmine/study-cybercirujas-killercoda

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      labs: ${{ steps.plan.outputs.labs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r requirements.lock && python -m pip install -q --no-deps -e .
      - id: plan
        # A family that cannot be proven today (e.g. Kubernetes 1.37 before a Cilium release lists it) is left out of the
        # matrix with a ::warning:: naming the reason; the other families are proven and published as usual. `labs=$(...)`
        # on its own line so a failure of the planner fails the step (inside `echo "$(...)"` it would be swallowed).
        run: |
          labs=$(python -m teach.lab test --target killercoda --plan ${TODAY:+--today "$TODAY"} 2>plan.err) || { cat plan.err; exit 1; }
          cat plan.err
          grep '^::warning' plan.err | sed 's/^::warning title=/- /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "labs=$labs" >> "$GITHUB_OUTPUT"
        env:
          TODAY: ${{ inputs.today }}

  prove:
    needs: plan
    if: needs.plan.outputs.labs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Optional channel: a lab that fails is simply not published (no evidence) and the rest still is.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.labs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r requirements.lock && python -m pip install -q --no-deps -e .
      - name: kubeadm cluster like Killercoda's (k8s family)
        id: env
        continue-on-error: true   # a bootstrap failure of one lab must not stop the other labs from being published
        if: matrix.image == 'kubernetes-kubeadm-1node'
        run: |
          # never a here-string of a command substitution into `read`: it hides a failing --print-env and the bootstrap dies
          # later on an empty argument. Exit 2 = no Cilium validated for today's Kubernetes (the date switched between plan
          # and prove): skip this lab with a warning, it is simply not published; any other failure fails.
          rc=0; envline=$(python -m teach.lab test --target killercoda --print-env ${{ matrix.image }} 2>env.err) || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=${{ matrix.lab }} not proven nor published::$(cat env.err)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$rc" -eq 0 ] || { cat env.err; exit "$rc"; }
          read -r patch cilium containerd <<<"$envline"
          sudo bash deploy/killercoda/bootstrap-kubeadm.sh "$patch" "$cilium" "$containerd"
      - name: Prove the scenario
        continue-on-error: true   # a failing lab is simply not published; the other scenarios still are
        if: steps.env.outputs.skip != 'true' && steps.env.outcome != 'failure'
        run: sudo -E env HOME=/root KUBECONFIG=/root/.kube/config "$(which python)" -m teach.lab test --target killercoda --evidence evidence ${{ matrix.lab }}
      - run: sudo chown -R "$USER" evidence 2>/dev/null || true
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: evidence-${{ strategy.job-index }}
          path: evidence
          if-no-files-found: ignore

  publish:
    needs: [plan, prove]
    # Only when every proof job ran to the end: a failed or cancelled prove must never turn into an export with no evidence.
    if: needs.prove.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # the metadata records the last commit that touched each lab
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q --require-hashes -r requirements.lock && python -m pip install -q --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true
      - name: Clone the mirror (the deploy key is on disk from here to the push step)
        env:
          KEY: ${{ secrets.KILLERCODA_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 "git@github.com:${MIRROR}.git" mirror
      - name: Export what has valid evidence (fresh, or still valid in the mirror)
        run: |
          mkdir -p evidence
          # scenarios that were not re-proven this run keep the evidence they already have in the mirror; it only counts
          # if it still matches the scenario hash and Killercoda's environment of today (the gate decides)
          (cd mirror && find . -name tested.json -not -path './.git/*') | while read -r f; do
            mkdir -p "evidence/$(dirname "$f")"; cp -n "mirror/$f" "evidence/$f"
          done
          python -m teach.lab export --target killercoda --all --evidence evidence --out build/killercoda | tee export.log
          { echo "### Killercoda export"; grep -E "^(not published|\[study-lab\])" export.log || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push to the mirror
        env:
          STUDY_SHA: ${{ github.sha }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export STUDY_SHA="${STUDY_SHA::7}"
          set +e; bash deploy/killercoda/publish.sh build/killercoda mirror; rc=$?; set -e
          if [ "$rc" -eq 3 ]; then echo "::warning::no scenario has valid evidence: the mirror was not touched" | tee -a "$GITHUB_STEP_SUMMARY"; rc=0; fi
          [ "$rc" -eq 0 ] || exit "$rc"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd mirror
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then echo "Nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
          elif git push -q origin HEAD:main; then echo "Pushed to mirror main." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git push -q origin "HEAD:refs/heads/export/study-${STUDY_SHA}"
            echo "::warning::main of the mirror is protected and the deploy key cannot bypass it: pushed branch export/study-${STUDY_SHA} (see #102)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          rm -f ~/.ssh/mirror_key
