name: Killercoda publish

# On a merge to main that changes labs or the exporter: prove every scenario that has a reference fix (parity test, on
# Ubuntu 24.04 VMs), then export ONLY what passed and push it to the mirror, which Killercoda syncs through its webhook.
# No evidence, no publish. Idempotent: a tree identical to the mirror makes no commit.
# The deploy key (write access to the mirror only) is a secret used by the last job only.

on:
  push:
    branches: [main]
    paths: ['certs/**/lab/**', 'teach/lab/export_killercoda.py', 'teach/lab/kc_meta.py', 'teach/lab/kc_test.py', 'deploy/killercoda/**', '.github/workflows/killercoda-publish.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: killercoda-publish
  cancel-in-progress: false

env:
  MIRROR: villadalmine/study-cybercirujas-killercoda

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      labs: ${{ steps.plan.outputs.labs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -e '.[lab]'
      - id: plan
        run: echo "labs=$(python -m teach.lab test --target killercoda --plan)" >> "$GITHUB_OUTPUT"

  prove:
    needs: plan
    if: needs.plan.outputs.labs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.labs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -e '.[lab]'
      - name: kubeadm cluster like Killercoda's (k8s family)
        if: matrix.image == 'kubernetes-kubeadm-1node'
        run: |
          read -r minor cni <<<"$(python -m teach.lab test --target killercoda --print-env ${{ matrix.image }})"
          sudo bash deploy/killercoda/bootstrap-kubeadm.sh "$minor" "$cni"
      - name: Prove the scenario
        run: sudo -E env HOME=/root KUBECONFIG=/root/.kube/config "$(which python)" -m teach.lab test --target killercoda --evidence evidence ${{ matrix.lab }}
        continue-on-error: true   # a failing lab is simply not published; the other scenarios still are
      - run: sudo chown -R "$USER" evidence 2>/dev/null || true
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: evidence-${{ strategy.job-index }}
          path: evidence
          if-no-files-found: ignore

  publish:
    needs: [plan, prove]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0   # the metadata records the last commit that touched each lab
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -e '.[lab]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true
      - name: Export only the scenarios with passing evidence
        run: |
          mkdir -p evidence
          python -m teach.lab export --target killercoda --all --evidence evidence --out build/killercoda | tee export.log
          { echo "### Killercoda export"; grep -E "^(not published|\[study-lab\])" export.log || true; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push to the mirror (the only step that sees the key)
        env:
          KEY: ${{ secrets.KILLERCODA_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 "git@github.com:${MIRROR}.git" mirror
          rsync -a --delete --exclude .git --exclude .github --exclude README.md --exclude CONTRIBUTING.md \
            --exclude CODEOWNERS --exclude .gitattributes build/killercoda/ mirror/
          cd mirror
          git add -A
          if git diff --cached --quiet; then echo "Mirror already up to date: no commit." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git -c user.name="study-cybercirujas bot" -c user.email="noreply@users.noreply.github.com" commit -q -s \
            -m "export: study@${GITHUB_SHA::7}" -m "Generated by study-lab export --target killercoda; evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if git push -q origin HEAD:main; then echo "Pushed to mirror main." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git push -q origin "HEAD:refs/heads/export/study-${GITHUB_SHA::7}"
            echo "::warning::main of the mirror is protected and the deploy key cannot bypass it: pushed branch export/study-${GITHUB_SHA::7}. Add the key to the bypass list or merge it by hand." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          rm -f ~/.ssh/mirror_key
