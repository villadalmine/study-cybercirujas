name: Build & Push Docker Image

on:
  workflow_dispatch:
  workflow_call:
    # Called by release-please.yml when it creates a release: same build, plus the tag vX.Y.Z.
    inputs:
      version:
        description: 'Release version without the v (e.g. 0.3.0); empty = the usual tags only'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      # Everything deploy/Dockerfile COPYs. It ships every root *.yaml (the
      # API reads models.yaml and pipeline.yaml) and scripts/ (/api/status
      # imports from it); the filter listed only catalog.yaml, so the
      # 2026-10-12 models.yaml price refresh never reached the public image.
      - 'teach/**'
      - '*.yaml'
      - 'scripts/**'
      - 'certs/**'
      - 'media/**'
      - 'deploy/Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version && 'true' || 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
