name: Build & Push Docker Image

on:
  workflow_dispatch:
  workflow_call:
    # Called by release-please.yml when it creates a release: same build, plus the tag vX.Y.Z.
    inputs:
      version:
        description: 'Release version without the v (e.g. 0.3.0); empty = the usual tags only'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      # Everything deploy/Dockerfile COPYs. It ships every root *.yaml (the
      # API reads models.yaml and pipeline.yaml) and scripts/ (/api/status
      # imports from it); the filter listed only catalog.yaml, so the
      # 2026-10-12 models.yaml price refresh never reached the public image.
      - 'teach/**'
      - '*.yaml'
      - 'scripts/**'
      - 'certs/**'
      - 'media/**'
      - 'deploy/Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  # A PR that changes the Dockerfile, the dependencies, the app code or this workflow
  # builds both platforms without pushing, so a broken arm64 build (typically a new
  # dependency without an arm64 wheel) is seen on the PR, not when main publishes.
  pull_request:
    paths:
      - 'deploy/Dockerfile'
      - 'pyproject.toml'
      - 'teach/**'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # amd64 for the usual hosts, arm64 for home clusters (Raspberry Pi, RK3588,
  # Graviton). The base image is pinned by the digest of its multi-arch index.
  PLATFORMS: linux/amd64,linux/arm64

# Two quick merges must not publish :latest out of order; a PR run is replaced by the next push.
concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # arm64 is emulated with QEMU: slower than native
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130   # v3.7.0
        with:
          platforms: arm64
          # the action defaults to tonistiigi/binfmt:latest; pinned like everything else here
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version && 'true' || 'false' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
