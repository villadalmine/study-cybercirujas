name: Docs

# Documentation that stays true to the repository it describes, checked on
# every PR — the maintainer's rule (2026-10-15): "if you change something, all
# the documentation stays consistent; something that checks it on the PRs, and
# the same for whether the graph needs looking at".
#
# Deterministic, no keys, no model. graphify is a free pip install
# (tree-sitter only), pinned once, as GRAPHIFY_VERSION in the Makefile.
# openwiki/ is out on purpose: it costs API credits.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0       # check_graph diffs against the base branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e .
          .venv/bin/pip install -q "graphifyy==$(sed -n 's/^GRAPHIFY_VERSION *:= *//p' Makefile)"
      - name: Links, anchors, paths, make targets, teach commands, generated files
        run: .venv/bin/python3 scripts/check_docs.py
      - name: Code graph is what this tree builds
        # Rebuilt in a temp copy and compared with graphify-out/graph.json.
        # A warning, never a failure: main refreshes the committed graph itself
        # (graph.yml opens one bot PR), so a PR must not rebase or rebuild it.
        run: .venv/bin/python3 scripts/check_graph.py --regenerate
