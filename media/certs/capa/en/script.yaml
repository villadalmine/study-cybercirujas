cert: capa
lang: en
backend: claude
model: claude-opus-5
scenes:
  hook:
    title: Five Argo Tools, One Exam
    voiceover: Argo is not one tool, it's five, and the Certified Argo Project Associate
      is the exam that checks you actually know what each one does. Workflows, CD,
      Rollouts, Events, and the fundamentals that tie them together — weighted at
      exactly 20% each. No favorite corner to hide in.
  audience:
    title: Who it's for
    voiceover: This is an associate-level exam, so it's aimed at people who already
      work near Kubernetes and want their Argo knowledge recognized. If you've been
      running pipelines or GitOps deployments and learning the rest by osmosis, this
      is the one that closes the gaps.
    bullets:
    - Platform and DevOps engineers already running Argo CD in production
    - Kubernetes practitioners moving from manual deploys to GitOps
    - SREs and cloud-native newcomers who want a broad, credible starting point
  cta:
    title: Start with domain one
    voiceover: We've broken all five domains into study topics, hands-on labs, and
      practice questions on Cert Landscape. Your certification stays valid for three
      years — pick a domain and start today.
  domains:
    title: Exam domains
    voiceover: The exam covers Argo Project Fundamentals at 20.0%, Argo Workflows
      at 20.0%, Argo CD at 20.0%, Argo Rollouts at 20.0%, Argo Events at 20.0%.
    domains:
    - name: Argo Project Fundamentals
      weight: 20.0
    - name: Argo Workflows
      weight: 20.0
    - name: Argo CD
      weight: 20.0
    - name: Argo Rollouts
      weight: 20.0
    - name: Argo Events
      weight: 20.0
