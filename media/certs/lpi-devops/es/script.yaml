cert: lpi-devops
lang: es
backend: gemini
model: agy
scenes:
  hook:
    title: Impulsá tu carrera con LPI DevOps Tools Engineer
    voiceover: Si querés validar tus habilidades prácticas en automatización y contenedores,
      el examen LPI 701-100 es un paso clave. Esta certificación de nivel specialty
      evalúa tu dominio en herramientas fundamentales para optimizar el desarrollo
      de software y la infraestructura Linux. Te ayuda a demostrar con fundamentos
      sólidos que sabés conectar el código con la operación.
  audience:
    title: Para quién es esta certificación
    voiceover: Está pensada para profesionales del entorno Linux que buscan certificar
      su capacidad de implementar metodologías DevOps reales. El examen evalúa dominios
      clave como Software Engineering (30.0%) y Container Management (26.7%), junto
      a Configuration Management (16.7%), Machine Deployment (13.3%) y Service Operations
      (13.3%). Es ideal para respaldar tu conocimiento técnico con un título oficial
      con 5 años de vigencia.
    bullets:
    - Administradores de sistemas Linux que buscan migrar su perfil hacia DevOps
    - Desarrolladores de software que quieren dominar contenedores y automatización
    - Ingenieros de infraestructura orientados a la gestión de configuración y despliegues
  cta:
    title: Preparate en Cert Landscape
    voiceover: Explorá el temario completo del examen LPI 701-100 y organizá tu plan
      de estudio en Cert Landscape. Potenciá tus conocimientos y preparate para rendir
      con éxito.
  domains:
    title: Dominios del examen
    voiceover: El examen se reparte en Software Engineering con 30.0%, Container Management
      con 26.7%, Machine Deployment con 13.3%, Configuration Management con 16.7%,
      Service Operations con 13.3%.
    domains:
    - name: Software Engineering
      weight: 30.0
    - name: Container Management
      weight: 26.7
    - name: Machine Deployment
      weight: 13.3
    - name: Configuration Management
      weight: 16.7
    - name: Service Operations
      weight: 13.3
