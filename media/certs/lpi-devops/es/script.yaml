cert: lpi-devops
lang: es
backend: claude
model: claude-opus-5
scenes:
  hook:
    title: DevOps con nombre y apellido
    voiceover: 'El examen 701-100 de LPI no te pregunta qué es DevOps: te pide que
      lo hagas funcionar. Software Engineering pesa un 33,3%, y los contenedores,
      Kubernetes y la seguridad con observabilidad se reparten el resto casi en partes
      iguales. Es una radiografía honesta del trabajo real de una plataforma moderna.'
  audience:
    title: Para quién es
    voiceover: Es una certificación de especialidad, así que asume que ya te movés
      con soltura en Linux. Si venís del lado de sistemas y querés cruzar hacia entrega
      continua, o ya escribís pipelines y querés respaldo formal, este es tu examen.
      Vale cinco años, tiempo de sobra para que rinda.
    bullets:
    - Sysadmins de Linux que quieren dar el salto a DevOps
    - Desarrolladores que empujan su propio código a producción
    - SRE y gente de plataforma que ya vive entre contenedores y Kubernetes
  cta:
    title: Empezá por el dominio más pesado
    voiceover: En Cert Landscape tenés los cuatro dominios desglosados objetivo por
      objetivo, con ejercicios y laboratorios. Arrancá por Software Engineering, que
      es un tercio del examen, y seguí desde ahí.
  domains:
    title: Dominios del examen
    voiceover: El examen se reparte en Software Engineering con 33.3%, Application
      Container con 21.7%, Kubernetes con 21.7%, Security and Observability con 23.3%.
    domains:
    - name: Software Engineering
      weight: 33.3
    - name: Application Container
      weight: 21.7
    - name: Kubernetes
      weight: 21.7
    - name: Security and Observability
      weight: 23.3
