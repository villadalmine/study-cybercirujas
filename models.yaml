# Models offered by the study bot — the catalogue the UI is built from.
#
# Frozen on purpose: ids and prices are copied from openrouter.ai/api/v1/models
# at the date below, so `scripts/check_models.py` can compare them against the
# live API and report what moved. Same separation as the certification syllabi:
# what we froze lives here, what upstream publishes is fetched, and neither
# overwrites the other.
#
# SELECTION CRITERIA — this list is curated, not scraped. The bot explains
# certification material and writes exercises from it, so a model earns a slot
# by being a strong general instruction-follower, not by being large or cheap:
#
#   * general purpose only. Domain-tuned models are excluded even when free —
#     `ling-3.0-flash-fin` (finance) and `-sante` (health) would answer IT
#     questions from the wrong prior, `nemotron-3.5-content-safety` is a
#     classifier, and code-only models explain theory poorly.
#   * a known family with a track record over an unknown provider at the same
#     price. The first draft of the free tier picked by context length alone
#     and shipped exactly that mistake.
#   * enough context for one topic plus the answer: 130k covers everything in
#     this corpus, so anything above that is not a tie-breaker.
#
# WHAT THE PROBE ADDS — `scripts/probe_models.py` calls each model through the
# same endpoint the browser uses and writes back what it saw, so the UI is built
# on behaviour rather than on advertised capability:
#
#   probe:        ok | flaky | broken   — did it answer a one-word question
#   thinking:     effort | always | ignored | none | unknown  — what the effort
#                 selector actually does. `reasoning: true` above only means the
#                 model ADVERTISES the parameter; 13 of 18 that do behave
#                 differently from what that suggests.
#   thinking_off: present only when `reasoning: {enabled: false}` really stops it
#                 thinking. Absent means omitting the field is the best the UI
#                 can do — and on gpt-5-mini, gpt-5-nano, gpt-6-astra and
#                 minimax-m2.7 the endpoint answers "Reasoning is mandatory for
#                 this endpoint and cannot be disabled".
#   langs:        the languages the model may be offered in — those where it
#                 answered a question about a REAL topic of this corpus
#                 (lpi-010-160/5.2) IN that language. A model is excluded from a
#                 language only on evidence: a wrong answer, or a reply
#                 measurably in another language.
#   probed:       the date those four were last true.
#
# FREE MODELS CHANGE OFTEN — that is their nature, and it is why
# `scripts/check_models.py` runs inside `make check-updates`. When a free model
# starts charging or disappears, replace it against these criteria rather than
# by picking whatever is free that week.

