# Models offered by the study bot — the catalogue the UI is built from.
#
# Frozen on purpose: prices and ids are copied from openrouter.ai/api/v1/models
# at the date below, so `scripts/check_models.py` can compare them against the
# live API and report what moved. Same separation as the certification syllabi:
# what we froze lives here, what upstream publishes is fetched, and neither
# overwrites the other.
#
# Tiers describe what the bot does — read given material and teach from it —
# not raw benchmark rank. `free` models cost the student nothing but are rate
# limited by OpenRouter and change often; they are offered last on purpose.
