schema_version: 2
cert: cka
topic: '1.1'
title: Implement storage classes and dynamic volume provisioning
provider: local
resources:
  vms:
  - name: lab
    os: debian-12
    cpus: 1
    ram_mb: 1024
setup:
- break_fix.sh
requires: kind
kubernetes: '1.35'
script: break_fix.sh
modes:
  break:
    args:
    - break
  verify:
    args:
    - verify
    success:
      output_regex: Laboratorio resuelto
  cleanup:
    args:
    - cleanup
limits:
  ram_mb: 3072
  cpus: 2
level: intermediate
hints:
- kubectl describe pvc -n cka-1-1-storage-lab cka-lab-pvc — ¿qué provisioner está
  esperando?
- Compará con el provisioner de la StorageClass por defecto (kubectl get storageclass).
- El campo provisioner es inmutable — borrá la StorageClass y recreala con el mismo
  nombre.
- Copiá también el volumeBindingMode de la que funciona (local-path solo provisiona
  con WaitForFirstConsumer).
