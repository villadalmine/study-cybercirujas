paths:
  linux-lpi:
    name: Carrera Linux (LPI)
    description: De cero a experto Linux. Essentials no vence; LPIC duran 5 años y
      cada nivel exige el anterior activo.
    steps:
    - - lpi-010-160
    - - lpic-1
    - - lpic-2
    - - lpic-3-300
      - lpic-3-303
      - lpic-3-305
      - lpic-3-306
  kubernetes:
    name: Carrera Kubernetes (CNCF)
    description: Base cloud native → administración → seguridad. CKS exige CKA aprobada.
    steps:
    - - kcna
      - kcsa
    - - cka
      - ckad
    - - cks
  kubestronaut:
    name: Kubestronaut
    type: achievement
    description: 'Las 5 certs Kubernetes de CNCF, todas vigentes a la vez. Beneficios:
      campera, badge, 5 cupones 50% por año.'
    requires_all:
    - cka
    - ckad
    - cks
    - kcna
    - kcsa
    how_to_obtain: 'Aprobá las 5 certs y tenelas vigentes a la vez. CNCF te contacta
      por email dentro de la semana hábil. Con CARE el mantenimiento es más barato:
      recertificando CKS renovás también CKA y KCSA; recertificando CKA o CKAD renovás
      KCNA — 3 exámenes mantienen las 5 certs.'
  golden-kubestronaut:
    name: Golden Kubestronaut
    type: achievement
    description: 'Las 15 certs CNCF + LFCS, todas vigentes. Título de por vida. Beneficios:
      mochila, ThriveOne, KCD gratis anual.'
    requires_all:
    - cka
    - ckad
    - cks
    - kcna
    - kcsa
    - pca
    - ica
    - cca
    - capa
    - cgoa
    - cba
    - otca
    - kca
    - cnpa
    - cnpe
    - lfcs
    how_to_obtain: 'Aprobá las 15 certs CNCF + LFCS, todas vigentes a la vez. El título
      es de por vida (los beneficios ThriveOne requieren mantener el estado). Estrategia:
      empezar por las de 3 años (associates), después las de 2 años (CKA/CKAD/CKS/CNPE
      y LFCS) para que no venzan antes de completar.'
  care:
    name: Programa CARE — renovación automática
    type: info
    description: 'Certification Advancement & Recertification Experience (CNCF, vigente
      desde 2026-01-01; expandido 2026-06-17): aprobar una cert superior renueva automáticamente
      las inferiores, igualando fechas de vencimiento.'
    rules:
    - CKA o CKAD (aprobada/recertificada) → renueva KCNA
    - CKS (aprobada/recertificada) → renueva KCSA
    - CKS (aprobada/recertificada) → reinstala y extiende CKA, incluso vencida (desde
      2026-06-18)
