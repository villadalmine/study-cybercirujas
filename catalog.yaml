      pt:
        description: 'As 15 certs CNCF + LFCS, todas vigentes. Título vitalício. Benefícios:
          mochila, ThriveOne, KCD gratuito anual.'
        how_to_obtain: 'Passe nas 15 certs CNCF + LFCS, todas vigentes ao mesmo tempo.
          O título é vitalício (os benefícios ThriveOne exigem manter o status). Estratégia:
          começar pelas de 3 anos (associates), depois as de 2 anos (CKA/CKAD/CKS/CNPE
          e LFCS) para que não vençam antes de completar.'
