paths:
  kubernetes:
    name: Ingeniero Kubernetes
    description: Ruta troncal de Kubernetes desde los fundamentos cloud native hasta
      la administración y el desarrollo de aplicaciones sobre el clúster.
    steps:
    - - kcna
    - - cka
      - ckad
    - - cks
    i18n:
      en:
        description: Core Kubernetes path from cloud native fundamentals to administration
          and application development on the cluster.
        name: Kubernetes Engineer
      fr:
        description: Parcours central Kubernetes, des fondamentaux cloud native jusqu'à
          l'administration et au développement d'applications sur le cluster.
        name: Ingénieur Kubernetes
      de:
        description: Kernpfad für Kubernetes, von den Cloud-Native-Grundlagen bis
          zur Administration und Anwendungsentwicklung auf dem Cluster.
        name: Kubernetes-Engineer
      zh:
        name: Kubernetes 工程师
        description: Kubernetes 主干路线，从 cloud native 基础一直到集群上的管理与应用开发。
      ja:
        description: cloud nativeの基礎からクラスター上でのアプリケーション開発と管理まで進む、Kubernetesの中核ルート。
        name: Kubernetesエンジニア
      pt:
        description: Trilha principal de Kubernetes, desde os fundamentos cloud native
          até a administração e o desenvolvimento de aplicações no cluster.
        name: Engenheiro Kubernetes
  kubestronaut:
    name: Kubestronaut
    type: achievement
    description: 'Las 5 certs Kubernetes de CNCF, todas vigentes a la vez. Beneficios:
      campera, badge, 5 cupones 50% por año.'
    requires_all:
    - cka
    - ckad
    - cks
    - kcna
    - kcsa
    how_to_obtain: 'Aprobá las 5 certs y tenelas vigentes a la vez. CNCF te contacta
      por email dentro de la semana hábil. Con CARE el mantenimiento es más barato:
      recertificando CKS renovás también CKA y KCSA; recertificando CKA o CKAD renovás
      KCNA — 3 exámenes mantienen las 5 certs.'
    edited: true
    i18n:
      en:
        description: 'The 5 CNCF Kubernetes certs, all valid at once. Benefits: jacket,
          badge, 5 50%-off coupons per year.'
        how_to_obtain: 'Pass all 5 certs and hold them valid at the same time. CNCF
          contacts you by email within a business week. With CARE, maintenance is
          cheaper: recertifying CKS also renews CKA and KCSA; recertifying CKA or
          CKAD renews KCNA — 3 exams keep all 5 certs current.'
        name: Kubestronaut
      fr:
        description: 'Les 5 certifications Kubernetes de la CNCF, toutes valides en
          même temps. Avantages : veste, badge, 5 bons de réduction de 50 % par an.'
        how_to_obtain: 'Réussissez les 5 certifications et gardez-les valides en même
          temps. La CNCF vous contacte par e-mail sous une semaine ouvrée. Avec CARE,
          le maintien est moins cher : en recertifiant CKS vous renouvelez aussi CKA
          et KCSA ; en recertifiant CKA ou CKAD vous renouvelez KCNA — 3 examens maintiennent
          les 5 certifications.'
        name: Kubestronaut
      de:
        description: 'Die 5 Kubernetes-Zertifizierungen der CNCF, alle gleichzeitig
          gültig. Vorteile: Jacke, Badge, 5 Gutscheine mit 50 % Rabatt pro Jahr.'
        how_to_obtain: 'Bestehe die 5 Zertifizierungen und halte sie gleichzeitig
          gültig. Die CNCF kontaktiert dich innerhalb einer Arbeitswoche per E-Mail.
          Mit CARE ist die Aufrechterhaltung günstiger: mit der Rezertifizierung von
          CKS erneuerst du auch CKA und KCSA; mit der Rezertifizierung von CKA oder
          CKAD erneuerst du KCNA — 3 Prüfungen erhalten alle 5 Zertifizierungen.'
        name: Kubestronaut
      zh:
        name: Kubestronaut
        description: CNCF 的 5 项 Kubernetes 认证，全部同时有效。福利：夹克、徽章、每年 5 张 50% 折扣券。
        how_to_obtain: 通过全部 5 项认证并使其同时保持有效。CNCF 会在一个工作周内通过电子邮件与你联系。借助 CARE，维护成本更低：重新认证
          CKS 可同时续期 CKA 和 KCSA；重新认证 CKA 或 CKAD 可续期 KCNA — 3 场考试即可维持全部 5 项认证。
      ja:
        description: 'CNCFのKubernetes認定5つをすべて同時に有効な状態で保持。特典: ジャケット、バッジ、年5枚の50%割引クーポン。'
        how_to_obtain: '5つの認定に合格し、すべて同時に有効な状態にしてください。CNCFから1営業週間以内にメールで連絡があります。CAREにより維持コストが下がります:
          CKSを再認定するとCKAとKCSAも更新され、CKAまたはCKADを再認定するとKCNAも更新されます — 3つの試験で5つの認定を維持できます。'
        name: Kubestronaut
      pt:
        description: 'As 5 certs Kubernetes da CNCF, todas vigentes ao mesmo tempo.
          Benefícios: jaqueta, badge, 5 cupons de 50% por ano.'
        how_to_obtain: 'Passe nas 5 certs e mantenha todas vigentes ao mesmo tempo.
          A CNCF entra em contato por email dentro de uma semana útil. Com o CARE
          a manutenção é mais barata: recertificando CKS você renova também CKA e
          KCSA; recertificando CKA ou CKAD renova KCNA — 3 exames mantêm as 5 certs.'
        name: Kubestronaut
  golden-kubestronaut:
    name: Golden Kubestronaut
    type: achievement
    description: 'Las 15 certs CNCF + LFCS, todas vigentes. Título de por vida. Beneficios:
      mochila, ThriveOne, KCD gratis anual.'
    requires_all:
    - cka
    - ckad
    - cks
    - kcna
    - kcsa
    - pca
    - ica
    - cca
    - capa
    - cgoa
    - cba
    - otca
    - kca
    - cnpa
    - cnpe
    - lfcs
    how_to_obtain: 'Aprobá las 15 certs CNCF + LFCS, todas vigentes a la vez. El título
      es de por vida (los beneficios ThriveOne requieren mantener el estado). Estrategia:
      empezar por las de 3 años (associates), después las de 2 años (CKA/CKAD/CKS/CNPE
      y LFCS) para que no venzan antes de completar.'
    edited: true
    i18n:
      en:
        description: 'All 15 CNCF certs + LFCS, all valid at once. Lifetime title.
          Benefits: backpack, ThriveOne, free annual KCD.'
        how_to_obtain: 'Pass all 15 CNCF certs + LFCS, all valid at the same time.
          The title is for life (ThriveOne benefits require maintaining the status).
          Strategy: start with the 3-year ones (associates), then the 2-year ones
          (CKA/CKAD/CKS/CNPE and LFCS) so they don''t expire before you finish.'
        name: Golden Kubestronaut
      fr:
        description: 'Les 15 certifications CNCF + LFCS, toutes valides. Titre à vie.
          Avantages : sac à dos, ThriveOne, KCD gratuit chaque année.'
        how_to_obtain: 'Réussissez les 15 certifications CNCF + LFCS, toutes valides
          en même temps. Le titre est à vie (les avantages ThriveOne exigent de maintenir
          le statut). Stratégie : commencer par celles de 3 ans (associates), puis
          celles de 2 ans (CKA/CKAD/CKS/CNPE et LFCS) pour qu''elles n''expirent pas
          avant la fin.'
        name: Golden Kubestronaut
      de:
        description: 'Alle 15 CNCF-Zertifizierungen + LFCS, alle gleichzeitig gültig.
          Titel auf Lebenszeit. Vorteile: Rucksack, ThriveOne, jährlich ein kostenloses
          KCD.'
        how_to_obtain: 'Bestehe die 15 CNCF-Zertifizierungen + LFCS, alle gleichzeitig
          gültig. Der Titel gilt auf Lebenszeit (die ThriveOne-Vorteile erfordern
          die Aufrechterhaltung des Status). Strategie: mit den 3-Jahres-Zertifizierungen
          (Associates) beginnen, danach die 2-Jahres-Zertifizierungen (CKA/CKAD/CKS/CNPE
          und LFCS), damit sie nicht vor dem Abschluss ablaufen.'
        name: Golden Kubestronaut
      zh:
        name: Golden Kubestronaut
        description: 15 项 CNCF 认证 + LFCS，全部同时有效。终身头衔。福利：背包、ThriveOne、每年免费参加一次 KCD。
        how_to_obtain: 通过全部 15 项 CNCF 认证 + LFCS，并使其同时保持有效。头衔为终身制（ThriveOne 福利需要维持该状态）。策略：先考有效期
          3 年的认证（associate 级），再考有效期 2 年的（CKA/CKAD/CKS/CNPE 和 LFCS），以免在完成之前过期。
      ja:
        description: 'CNCFの全15認定 + LFCSをすべて有効な状態で保持。称号は生涯有効。特典: バックパック、ThriveOne、毎年無料のKCD。'
        how_to_obtain: 'CNCFの15認定 + LFCSにすべて合格し、同時に有効な状態にしてください。称号は生涯有効です（ThriveOneの特典はステータスの維持が必要）。戦略:
          まず有効期間3年の認定（associates）から始め、その後2年の認定（CKA/CKAD/CKS/CNPEとLFCS）を取得することで、完了前に期限切れになるのを防げます。'
