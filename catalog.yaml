  care:
    name: Programa CARE — renovación automática
    type: info
    description: 'Certification Advancement & Recertification Experience (CNCF, vigente
      desde 2026-01-01; expandido 2026-06-17): aprobar una cert superior renueva automáticamente
      las inferiores, igualando fechas de vencimiento.'
    rules:
    - CKA o CKAD (aprobada/recertificada) → renueva KCNA
    - CKS (aprobada/recertificada) → renueva KCSA
    - CKS (aprobada/recertificada) → reinstala y extiende CKA, incluso vencida (desde
      2026-06-18)
    edited: true
    i18n:
      en:
        description: 'Certification Advancement & Recertification Experience (CNCF,
          effective since 2026-01-01; expanded 2026-06-17): passing a higher-level
          cert automatically renews the lower ones, aligning expiration dates.'
        name: CARE Program — automatic renewal
        rules:
        - CKA or CKAD (passed/recertified) → renews KCNA
        - CKS (passed/recertified) → renews KCSA
        - CKS (passed/recertified) → reinstates and extends CKA, even if expired (since
          2026-06-18)
      fr:
        description: 'Certification Advancement & Recertification Experience (CNCF,
          en vigueur depuis le 2026-01-01 ; élargi le 2026-06-17) : réussir une certification
          supérieure renouvelle automatiquement les inférieures, en alignant les dates
          d''expiration.'
        name: Programme CARE — renouvellement automatique
        rules:
        - CKA ou CKAD (réussie/recertifiée) → renouvelle KCNA
        - CKS (réussie/recertifiée) → renouvelle KCSA
        - CKS (réussie/recertifiée) → réactive et prolonge CKA, même expirée (depuis
          le 2026-06-18)
      de:
        description: 'Certification Advancement & Recertification Experience (CNCF,
          gültig seit 2026-01-01; erweitert am 2026-06-17): das Bestehen einer höheren
          Zertifizierung erneuert automatisch die untergeordneten und gleicht deren
          Ablaufdaten an.'
        name: CARE-Programm — automatische Rezertifizierung
        rules:
        - CKA oder CKAD (bestanden/rezertifiziert) → erneuert KCNA
        - CKS (bestanden/rezertifiziert) → erneuert KCSA
        - CKS (bestanden/rezertifiziert) → reaktiviert und verlängert CKA, auch wenn
          bereits abgelaufen (seit 2026-06-18)
      zh:
        name: CARE 计划 — 自动续期
        description: Certification Advancement & Recertification Experience（CNCF，自
          2026-01-01 起生效；2026-06-17 扩展）：通过更高级别的认证会自动续期较低级别的认证，并使到期日期保持一致。
        rules:
        - CKA 或 CKAD（通过/重新认证）→ 续期 KCNA
        - CKS（通过/重新认证）→ 续期 KCSA
        - CKS（通过/重新认证）→ 恢复并延长 CKA，即使已过期（自 2026-06-18 起）
      ja:
        description: 'Certification Advancement & Recertification Experience (CNCF、2026-01-01より有効、2026-06-17に拡大):
          上位の認定に合格すると下位の認定が自動的に更新され、有効期限が揃えられます。'
        name: CAREプログラム — 自動更新
        rules:
        - CKA または CKAD（合格/再認定）→ KCNA を更新
        - CKS（合格/再認定）→ KCSA を更新
        - CKS（合格/再認定）→ CKA を再有効化して延長（期限切れでも可、2026-06-18より）
      pt:
        description: 'Certification Advancement & Recertification Experience (CNCF,
          em vigor desde 2026-01-01; expandido em 2026-06-17): passar em uma cert
          superior renova automaticamente as inferiores, igualando as datas de vencimento.'
        name: Programa CARE — renovação automática
        rules:
        - CKA ou CKAD (aprovada/recertificada) → renova KCNA
        - CKS (aprovada/recertificada) → renova KCSA
        - CKS (aprovada/recertificada) → reinstala e estende CKA, mesmo vencida (desde
          2026-06-18)
