[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teach-plat"
version = "0.6.2"
description = "Plataforma educativa self-service: certificaciones, contenido generado con AI y labs on-demand"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "openai>=1.30",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pillow>=10.0",
]

# The MCP server (teach/mcp_server.py) is not part of the deployed application:
# the pod serves HTTP and has no use for stdio tools, so the SDK would be weight
# in an image that ships the whole corpus. Installed on a workstation with
# `make mcp-setup`, the same shape as `make graph-setup` for graphify.
[project.optional-dependencies]
mcp = ["mcp>=2.0"]
# study-lab validate (JSON Schema of lab.yaml v2). The runner itself is stdlib + PyYAML.
lab = ["jsonschema>=4.10", "pytest>=8"]

[project.scripts]
teach = "teach.cli:main"
study-lab = "teach.lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["teach"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end with Docker (make test-e2e)"]
