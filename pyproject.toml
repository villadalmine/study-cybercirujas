[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teach-plat"
version = "0.1.0"
description = "Plataforma educativa self-service: certificaciones, contenido generado con AI y labs on-demand"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "openai>=1.30",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pillow>=10.0",
]

[project.scripts]
teach = "teach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["teach"]
